<title>Planet 28 Warband Builder</title>
<meta name="description" content="Build Planet 28 (2nd edition) warbands: points, traits, abilities, equipment, squads, custom weapons and character sheets.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: personnel-file console. Sticky points strip on top, roster rail on the left, dossier editor on the right; stacks on phones. */
:root {
  --bg: #E7EAEE;
  --panel: #F6F7F9;
  --panel-2: #EEF1F4;
  --ink: #18202C;
  --muted: #586274;
  --line: #C6CDD7;
  --accent: #B8460F;
  --accent-soft: #F3DCCD;
  --accent-ink: #FFFFFF;
  --good: #2C7A4B;
  --warn: #9A6412;
  --bad: #B42318;
  --font-display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1218; --panel: #161B24; --panel-2: #1C2230; --ink: #E4E8EE; --muted: #8E98AA;
    --line: #2A3242; --accent: #F0883A; --accent-soft: #3A2516; --accent-ink: #1A0F06;
    --good: #52C48A; --warn: #E2A84A; --bad: #F2705F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1218; --panel: #161B24; --panel-2: #1C2230; --ink: #E4E8EE; --muted: #8E98AA;
  --line: #2A3242; --accent: #F0883A; --accent-soft: #3A2516; --accent-ink: #1A0F06;
  --good: #52C48A; --warn: #E2A84A; --bad: #F2705F; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.5; padding-inline: 16px; padding-block: 0 48px; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .04em; margin: 0; text-wrap: balance; }
.num, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.wrap { max-width: 1240px; margin: 0 auto; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- top strip ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); margin-inline: -16px; padding: 12px 16px 10px; }
.top-inner { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; max-width: 1240px; margin: 0 auto; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-size: 30px; line-height: 1; font-weight: 700; letter-spacing: .06em; }
.brand h1 span { color: var(--accent); }
.brand .sub { font-family: var(--font-display); font-size: 16px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.meter { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.meter .pts { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 500; white-space: nowrap; }
.meter .pts small { font-size: 13px; color: var(--muted); }
.meter .pts.over { color: var(--bad); }
.bar { width: 180px; max-width: 40vw; height: 8px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.bar.over i { background: var(--bad); }
.credits { font-size: 13px; color: var(--muted); }
.credits b { font-family: var(--font-mono); color: var(--ink); font-weight: 500; }

.quote { max-width: 1240px; margin: 14px auto 0; font-style: italic; color: var(--muted); font-size: 14px; display: flex; gap: 10px; align-items: flex-start; }
.quote::before { content: ""; flex: 0 0 3px; align-self: stretch; background: var(--accent); border-radius: 2px; opacity: .6; }
.quote button { margin-left: auto; flex: none; }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 4px; margin: 16px auto 16px; max-width: 1240px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { background: none; border: 0; padding: 8px 14px; font-family: var(--font-display); text-transform: uppercase; letter-spacing: .08em; font-size: 16px; color: var(--muted); border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-size: 14px; line-height: 1.2; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); border-color: var(--line); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 3px 8px; font-size: 13px; }
.field { display: grid; gap: 4px; }
.field > span { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; }
.input, select.input, textarea.input { width: 100%; padding: 7px 10px; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel); }
textarea.input { resize: vertical; min-height: 70px; }
.input:focus { border-color: var(--accent); outline: none; }

/* ---------- build layout ---------- */
.build { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; max-width: 1240px; margin: 0 auto; align-items: start; }
@media (max-width: 860px) { .build { grid-template-columns: minmax(0, 1fr); } }

.rail { display: grid; gap: 12px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 96px); }
@media (max-width: 860px) { .rail { position: static; } }
.wb-head { display: grid; gap: 10px; padding: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.wb-head .row { display: grid; grid-template-columns: 1fr 96px; gap: 8px; }
.roster { display: grid; gap: 6px; }
.rcard { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 2px 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); cursor: pointer; text-align: left; width: 100%; }
.rcard:hover { border-color: var(--muted); }
.rcard[aria-current="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.rcard .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rcard .c { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 14px; }
.rcard .line { grid-column: 1 / -1; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.pill { display: inline-block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; padding: 1px 6px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); font-family: var(--font-body); vertical-align: 1px; margin-left: 4px; }
.pill.acc { border-color: var(--accent); color: var(--accent); }
.checks { display: grid; gap: 6px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); font-size: 13px; }
.chk { display: flex; gap: 8px; align-items: flex-start; }
.dot { flex: none; width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; background: var(--good); }
.dot.warn { background: var(--warn); }
.dot.bad { background: var(--bad); }

/* ---------- dossier ---------- */
.dossier { display: grid; gap: 16px; min-width: 0; }
.sec { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 14px; min-width: 0; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.sec-h h2 { font-size: 20px; }
.sec-h .tot { font-family: var(--font-mono); font-size: 14px; color: var(--muted); }
.sec-h .tot b { color: var(--ink); font-weight: 500; }
.intro { font-size: 14px; color: var(--muted); max-width: 70ch; margin: 0; }
.id-grid { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: end; }
@media (max-width: 560px) { .id-grid { grid-template-columns: minmax(0,1fr); } }

.stats { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 760px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 420px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { border: 1px solid var(--line); border-radius: var(--r); padding: 8px 6px 6px; display: grid; justify-items: center; gap: 2px; background: var(--panel-2); }
.stat .lbl { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .1em; font-size: 13px; color: var(--muted); white-space: nowrap; }
.stat .val { font-family: var(--font-mono); font-size: 26px; font-weight: 500; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .val small { font-size: 13px; color: var(--muted); }
.stat .ctl { display: flex; gap: 4px; }
.stat .ctl button { width: 28px; height: 26px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-family: var(--font-mono); font-size: 15px; line-height: 1; }
.stat .ctl button:disabled { opacity: .35; cursor: default; }
.stat .ctl button:not(:disabled):hover { border-color: var(--accent); color: var(--accent); }
.stat .cost { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.stat.fixed { background: none; border-style: dashed; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 10px; border-radius: 99px; background: var(--accent-soft); border: 1px solid transparent; font-size: 13px; }
.chip .num { font-size: 12px; color: var(--muted); }
.chip button { border: 0; background: none; cursor: pointer; width: 20px; height: 20px; border-radius: 50%; color: var(--muted); line-height: 1; }
.chip button:hover { color: var(--bad); }
.empty { font-size: 13px; color: var(--muted); font-style: italic; }

.picker { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.picker-top { display: flex; gap: 8px; padding: 8px; border-bottom: 1px solid var(--line); background: var(--panel-2); align-items: center; flex-wrap: wrap; }
.picker-top .input { flex: 1 1 180px; padding: 5px 9px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 4px 10px; font-size: 13px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.list { max-height: 340px; overflow-y: auto; }
.opt { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; align-items: start; width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; }
.opt:last-child { border-bottom: 0; }
.opt:hover { background: var(--panel-2); }
.opt .box { width: 18px; height: 18px; border: 1.5px solid var(--muted); border-radius: 4px; margin-top: 2px; display: grid; place-items: center; font-size: 12px; color: var(--accent-ink); }
.opt.on .box { background: var(--accent); border-color: var(--accent); }
.opt .t { font-weight: 600; }
.opt .d { font-size: 13px; color: var(--muted); }
.opt .cst { font-family: var(--font-mono); font-size: 14px; white-space: nowrap; }
.neg { color: var(--good); }
.opt.blocked { opacity: .5; }

.eq-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.eq-wrap { overflow-x: auto; }
.eq-table th { text-align: left; font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--panel-2); position: sticky; top: 0; }
.eq-table td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.eq-table tr:last-child td { border-bottom: 0; }
.eq-table td.n { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.eq-table td.nm { font-weight: 600; white-space: nowrap; }
.eq-table .kw { font-size: 12px; color: var(--muted); }

.carried { display: grid; gap: 6px; }
.citem { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel-2); }
.citem .nm { font-weight: 600; }
.citem .meta { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--panel); }
.qty button { border: 0; background: none; width: 26px; height: 26px; cursor: pointer; font-family: var(--font-mono); }
.qty span { min-width: 24px; text-align: center; font-family: var(--font-mono); font-size: 13px; }
.sub-h { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .08em; font-size: 15px; color: var(--muted); margin: 4px 0 -4px; }

.armour-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.arm { text-align: left; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel-2); cursor: pointer; display: grid; gap: 2px; }
.arm:hover { border-color: var(--muted); }
.arm[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.arm .t { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.arm .t .num { font-weight: 400; font-size: 13px; }
.arm .d { font-size: 12px; color: var(--muted); }

.ledger { display: grid; gap: 4px; font-size: 14px; }
.ledger div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dotted var(--line); padding-bottom: 3px; }
.ledger div span:last-child { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.ledger .total { border-bottom: 0; font-weight: 600; padding-top: 6px; border-top: 1px solid var(--ink); font-size: 16px; }

.toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; user-select: none; }
.toggle input { width: 16px; height: 16px; accent-color: var(--accent); }

/* ---------- empty state ---------- */
.blank { text-align: center; padding: 48px 20px; border: 1px dashed var(--line); border-radius: var(--r); display: grid; gap: 12px; justify-items: center; color: var(--muted); }

/* ---------- sheets ---------- */
.sheets { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 16px; max-width: 1240px; margin: 0 auto; }
.sheet { background: var(--panel); border: 2px solid var(--ink); border-radius: 4px; padding: 14px 16px; display: grid; gap: 10px; break-inside: avoid; }
.sheet-h { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; border-bottom: 2px solid var(--ink); padding-bottom: 6px; flex-wrap: wrap; }
.sheet-h h3 { font-size: 22px; }
.sheet-h .num { font-size: 14px; }
.sstats { display: grid; grid-template-columns: repeat(7, 1fr); border: 1px solid var(--ink); }
.sstats div { text-align: center; padding: 4px 2px; border-right: 1px solid var(--ink); }
.sstats div:last-child { border-right: 0; }
.sstats .k { font-family: var(--font-display); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.sstats .v { font-family: var(--font-mono); font-size: 18px; font-weight: 500; }
.sblock .k { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .08em; font-size: 14px; }
.sblock ul { margin: 2px 0 0; padding-left: 18px; font-size: 13px; }
.sblock li { margin-bottom: 2px; }
.sblock p { margin: 2px 0 0; font-size: 13px; }
.lines { height: 54px; background: repeating-linear-gradient(to bottom, transparent 0 17px, var(--line) 17px 18px); }
.sheet .bg { font-style: italic; font-size: 13px; color: var(--muted); }
.sheets-bar { max-width: 1240px; margin: 0 auto 16px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }

/* ---------- armoury & saved ---------- */
.page { max-width: 1240px; margin: 0 auto; display: grid; gap: 16px; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .two { grid-template-columns: minmax(0, 1fr); } }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 480px) { .form-grid { grid-template-columns: minmax(0,1fr); } }
.calc { font-family: var(--font-mono); font-size: 13px; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 3px; }
.calc div { display: flex; justify-content: space-between; gap: 8px; }
.calc .total { border-top: 1px solid var(--line); padding-top: 5px; margin-top: 3px; font-weight: 500; font-size: 15px; }
.saved { display: grid; gap: 8px; }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
.srow[aria-current="true"] { border-color: var(--accent); }
.srow .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.note { font-size: 13px; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: var(--r); font-size: 14px; z-index: 50; }

@media print {
  .top, .tabs, .sheets-bar, .quote { display: none !important; }
  body { background: #fff; color: #000; padding: 0; }
  .sheets { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top">
  <div class="top-inner">
    <div class="brand"><h1>Planet <span>28</span></h1><span class="sub">Warband builder</span></div>
    <div class="meter" id="meter"></div>
  </div>
</header>
<div class="quote" id="quote"></div>
<nav class="tabs" role="tablist" id="tabs"></nav>
<main id="app"></main>
<div class="toast" id="toast" hidden></div>

<script>
/* =====================================================================
   RULES DATA — Planet 28, second edition (Mammoth Miniatures).
   Page numbers refer to the printed book. Edit here to fix or add entries.
   ===================================================================== */
const RULES = {
  baseCost: 10,          // p.23 every new character
  skillCost: 10,         // p.23 per +1 skill
  skillMin: 1, skillMax: 10,
  hpStart: 20, hpStep: 2, hpStepCost: 10, hpMin: 2,
  speed: 10,             // cm, cannot be bought
  minCharacters: 2,
  defaultLimit: 500,
  squadMin: 3, squadMax: 10,
};

const SKILLS = [
  { k: "A",  name: "Agility",   d: "How well a character moves and navigates their environment." },
  { k: "S",  name: "Shooting",  d: "How well a character fights using ranged weapons and firearms." },
  { k: "F",  name: "Fighting",  d: "How well a character fights in hand to hand combat." },
  { k: "P",  name: "Psyche",    d: "How intelligent a character is, and how well they use or resist psychic powers." },
  { k: "AW", name: "Awareness", d: "How well a character responds to their surroundings." },
];

// Character traits table, pp.64–67
const TRAITS = [
  ["Ammo smith", 15, "After each game this character may craft 1 piece of ammo for any weapon of their choice. This is automatically added to their equipment."],
  ["Animal", -20, "This character may not use any abilities or perform shoot actions. This character suffers -1(P) during break tests."],
  ["Armless", -20, "This character is missing an arm. They may only wield a single 1 handed weapon or use a single item at any time."],
  ["Blessed", 50, "This character may roll 2D10 for all skill rolls and keep the lowest score."],
  ["Big", 8, "This character gains an additional +1(F) when charging. This character suffers -3cm speed."],
  ["Bulwark", 10, "Enemies do not receive the standard +1D4(F) when charging this character."],
  ["Brawler", 9, "This character's fists do an additional +1D6 damage."],
  ["Brave", 15, "This character may reroll 1 failed break test per turn."],
  ["Barbaric", -10, "This character is immune to the Persuade ability. They may not wield any weapons or wear any armour with the keyword Complex."],
  ["Cursed", -50, "This character must roll 2D10 for all skill rolls and keep the highest score."],
  ["Coward", -15, "This character must make a break test when charged and may not charge any other character."],
  ["Climber", 5, "This character gains +2(A) when attempting to climb any vertical surface."],
  ["Death-proof", 25, "When rolling on the injuries table this character may treat Dead as Complete recovery."],
  ["Extra limbs", 25, "This character may wield 4 Single handed weapons or 2 Double handed weapons at once."],
  ["Engineer", 12, "When embarked in a vehicle this character automatically restores 1D4 hit-points per turn to any damaged sections in the same facing as the one from which they embarked."],
  ["Fast", 6, "At the start of each turn, roll 1D6. Add this to this character's speed for that turn."],
  ["Fearless", 12, "This character is immune to the effects of the Fearsome and Terrifying traits."],
  ["Fearsome", 12, "Enemies wishing to charge this character must first pass a break test."],

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const sgn = n => (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n);
const TRAIT = Object.fromEntries(TRAITS.map(t => [t.name, t]));

// Max potential damage of a dice expression, e.g. "2D10+4" -> 24, "1D4-1" -> 3
function maxDamage(expr) {
  const s = String(expr).toUpperCase().replace(/\s+/g, "");
  if (!s) return 0;
  let total = 0, ok = false;
  const re = /([+-]?)(\d*)D(\d+)|([+-]?)(\d+)/g;
  let m;
  while ((m = re.exec(s))) {
    ok = true;
    if (m[3]) total += (m[1] === "-" ? -1 : 1) * (parseInt(m[2] || "1", 10) * parseInt(m[3], 10));
    else total += (m[4] === "-" ? -1 : 1) * parseInt(m[5], 10);
  }
  return ok ? total : 0;
}

function costParts(c, w = wb()) {
  const skills = SKILLS.reduce((s, k) => s + (c.skills[k.k] - 1) * RULES.skillCost, 0);
  const hp = ((c.hp - RULES.hpStart) / RULES.hpStep) * RULES.hpStepCost;
  const traits = c.traits.reduce((s, n) => s + (TRAIT[n]?.cost || 0), 0);
  const abilities = c.abilities.reduce((s, n) => s + (ABIL[n]?.cost || 0), 0);
  const weapons = c.weapons.reduce((s, x) => s + (weaponById(x.id, w)?.cost || 0) * x.qty, 0);
  const armour = ARM[c.armour]?.cost || 0;
  const items = Object.entries(c.items).reduce((s, [id, q]) => s + (ITEM[id]?.cost || 0) * q, 0);
  const each = RULES.baseCost + skills + hp + traits + abilities + weapons + armour + items;
  const models = c.squad ? c.size : 1;
  return { base: RULES.baseCost, skills, hp, traits, abilities, weapons, armour, items, equipment: weapons + armour + items, each, models, total: each * models };
}
const charCost = c => costParts(c).total;
function wbTotal(w = wb()) { return w.characters.reduce((s, c) => s + costParts(c, w).total, 0); }
function modelCount(w = wb()) { return w.characters.reduce((s, c) => s + (c.squad ? c.size : 1), 0); }

function speedOf(c) {
  let s = RULES.speed; const notes = [];
  if (c.traits.includes("Big") || c.traits.includes("Gigantic")) s -= 3;
  if (c.traits.includes("Fast")) notes.push("+1D6");
  if (c.traits.includes("Slow")) notes.push("−1D6");
  return { s, notes };
}
function handsAvailable(c) {
  if (c.traits.includes("Armless")) return 1;
  if (c.traits.includes("Extra limbs")) return 4;
  return 2;
}
function isComplex(item) { return /complex/i.test(item?.type || ""); }

function charChecks(c) {
  const out = [];
  const t = n => c.traits.includes(n);
  if (t("Big") && t("Gigantic")) out.push(["warn", "Gigantic already includes all the effects of Big, so Big is paying twice."]);
  if (t("Blessed") && t("Cursed")) out.push(["warn", "Blessed and Cursed cancel out: one keeps the lowest of 2D10, the other the highest."]);
  if (t("Fast") && t("Slow")) out.push(["warn", "Fast and Slow both roll 1D6 against speed each turn."]);
  if (t("Brave") && t("Unshakable")) out.push(["warn", "Unshakable never takes break tests, so Brave's reroll does nothing."]);
  if (t("Coward") && t("Unshakable")) out.push(["warn", "Coward forces break tests that Unshakable never takes. Check with your opponent."]);
  if (t("Animal") && c.abilities.length) out.push(["bad", "Animal characters may not use any abilities."]);
  if (t("Animal") && c.weapons.some(x => /ranged/i.test(weaponById(x.id)?.type || ""))) out.push(["bad", "Animal characters may not perform shoot actions, so ranged weapons are wasted."]);
  if (t("Barbaric")) {
    const bad = c.weapons.map(x => weaponById(x.id)).filter(isComplex).map(x => x.name);
    if (bad.length) out.push(["bad", `Barbaric characters may not wield Complex weapons: ${bad.join(", ")}.`]);
  }
  if (t("Psychic") && !t("Minor arcana") && !t("Major arcana")) out.push(["warn", "Psychic rerolls failed arcana, but this character has no Minor or Major arcana."]);
  if (t("Minor arcana") && t("Major arcana")) out.push(["warn", "Minor and Major arcana both taken. Major already rolls 3 abilities."]);
  // hands
  const hands = c.weapons.reduce((s, x) => s + (weaponById(x.id)?.hands || 1) * x.qty, 0);
  const av = handsAvailable(c);
  if (hands > av) out.push(["info", `Carrying ${hands} hands' worth of weapons with ${av} hand${av > 1 ? "s" : ""}. Swapping weapons takes an action.`]);
  // ammo
  const need = {};
  c.weapons.forEach(x => { const w = weaponById(x.id); if (w?.rules?.includes("Reload")) need[w.ammo || "any"] = w.name; });
  for (const [kind, wname] of Object.entries(need)) {
    if (kind === "any") { if (!["ammo-rough", "ammo-basic", "ammo-special"].some(i => c.items[i])) out.push(["warn", `${wname} has Reload but the character carries no ammo.`]); }
    else if (!c.items["ammo-" + kind]) out.push(["warn", `${wname} needs ${kind} ammo to reload, and the character carries none.`]);
  }
  if (c.hp < RULES.hpStart && c.hp <= 10) out.push(["info", `Only ${c.hp} hit-points. Skills drop by 1 once they lose half.`]);
  if (c.squad && (c.size < RULES.squadMin || c.size > RULES.squadMax)) out.push(["bad", `Squads must have ${RULES.squadMin} to ${RULES.squadMax} members.`]);
  return out;
}
function wbChecks(w = wb()) {
  const out = [];
  const total = wbTotal(w);
  const models = modelCount(w);
  if (models < RULES.minCharacters) out.push(["bad", `A warband needs at least ${RULES.minCharacters} characters (has ${models}).`]);
  if (total > w.limit) out.push(["bad", `${total - w.limit} points over the ${w.limit} point limit.`]);
  w.characters.forEach(c => charChecks(c).filter(x => x[0] === "bad").forEach(x => out.push(["bad", `${c.name || "Unnamed"}: ${x[1]}`])));
  if (!out.length) out.push(["ok", "Warband is legal and ready to deploy."]);
  return out;
}

/* =====================================================================
   RENDER
   ===================================================================== */
function render() {
  // keep scroll positions of inner lists
  const keep = {};
  document.querySelectorAll("[data-scroll]").forEach(el => keep[el.dataset.scroll] = el.scrollTop);
  renderMeter(); renderQuote(); renderTabs();
  const app = $("#app");
  if (ui.tab === "build") app.innerHTML = viewBuild();
  else if (ui.tab === "sheets") app.innerHTML = viewSheets();
  else if (ui.tab === "armoury") app.innerHTML = viewArmoury();
  else app.innerHTML = viewSaved();
  applyFilter("trait"); applyFilter("weap");
  document.querySelectorAll("[data-scroll]").forEach(el => { if (keep[el.dataset.scroll] != null) el.scrollTop = keep[el.dataset.scroll]; });
}

function renderMeter() {
  const w = wb(), total = wbTotal(w), over = total > w.limit;
  const pct = Math.min(100, (total / Math.max(1, w.limit)) * 100);
  const left = w.limit - total;
  $("#meter").innerHTML = `
    <div class="pts num ${over ? "over" : ""}">${total} <small>/ ${w.limit} pts</small></div>
    <div class="bar ${over ? "over" : ""}" role="img" aria-label="${Math.round(pct)}% of points spent"><i style="width:${pct}%"></i></div>
    <div class="credits">${over ? `<b style="color:var(--bad)">${-left}</b> over` : `<b>${left}</b> left → credits`} · <b>${modelCount(w)}</b> models</div>`;
}
function renderQuote() {
  const [q, src] = QUOTES[ui.quote];
  $("#quote").innerHTML = `<div>“${esc(q)}”${src ? ` <span class="muted" style="font-style:normal">— ${esc(src)}</span>` : ""}</div><button class="btn ghost sm" data-act="quote" aria-label="Another quote">↻</button>`;
}
function renderTabs() {
  const tabs = [["build", "Build"], ["sheets", "Character sheets"], ["armoury", "Custom weapons"], ["saved", "Saved warbands"]];
  $("#tabs").innerHTML = tabs.map(([k, l]) => `<button class="tab" role="tab" aria-selected="${ui.tab === k}" data-act="tab" data-v="${k}">${l}</button>`).join("");
}

  <div class="sheets">${w.characters.map(c => {
    const p = costParts(c), sp = speedOf(c);

      `<b>${esc(ARM[c.armour].name)}</b> <span class="mono">def ${esc(ARM[c.armour].def)}</span>`,

/* ---------- custom weapons ---------- */
function blankCW() { return { name: "", kind: "Ranged", keywords: "", dmg: "2D6", range: 20, oneHanded: false, rules: [], ammo: "basic" }; }
function cwCost(f) {
  const md = maxDamage(f.dmg), rng = f.kind === "Melee" ? 0 : Math.max(0, +f.range || 0);
  const oh = f.oneHanded ? 10 : 0;
  const sp = f.rules.reduce((s, n) => s + (SPEC[n]?.cost || 0), 0);
  return { md, rng, oh, sp, total: md + rng + oh + sp };
}

      <div class="calc" id="cw-calc">${cwCalc(k)}</div>

    <div class="sec">
      <div class="sec-h"><h2>${esc(w.name)} armoury</h2></div>
      ${(w.customWeapons || []).length ? `<div class="carried">${w.customWeapons.map(cw => `<div class="citem"><div style="min-width:0"><div class="nm">${esc(cw.name)}</div><div class="meta">${esc(cw.type)} · ${esc(cw.dmg)} · ${cw.range ? cw.range + "cm" : "melee"} · ${cw.hands === 2 ? "two" : "one"}-handed${cw.rules.length ? " · " + esc(cw.rules.join(", ")) : ""}</div></div><span class="num">${cw.cost} cr</span><button class="btn sm danger" data-act="cwdel" data-v="${cw.id}">Remove</button></div>`).join("")}</div>
      <p class="note">Custom weapons appear in every character's weapon list for this warband.</p>` : `<p class="empty">No custom weapons yet. Forged weapons are saved with this warband and show up in the weapon list on the Build tab.</p>`}
    </div>
  </div></div>`;
}
function cwCalc(k) {
  return `<div><span>Max damage</span><span>${k.md}</span></div><div><span>Range</span><span>${k.rng}</span></div><div><span>One-handed</span><span>${k.oh}</span></div><div><span>Special rules</span><span>${sgn(k.sp) || 0}</span></div><div class="total"><span>Cost</span><span>${k.total} credits</span></div>`;
}

/* ---------- saved ---------- */
function viewSaved() {
  const list = Object.values(db.warbands).sort((a, b) => b.updated - a.updated);
  return `<div class="page"><div class="two">
    <div class="sec">
      <div class="sec-h"><h2>Your warbands</h2><button class="btn primary sm" data-act="wb-new">+ New warband</button></div>
      <p class="intro">Warbands are kept in this browser. To move one to another device or hand it to a friend, copy it as text and load it on the other side.</p>
      <div class="saved">${list.map(w => `<div class="srow" aria-current="${w.id === db.current}">
        <div style="min-width:0"><div style="font-weight:600">${esc(w.name)}</div><div class="note num">${wbTotal(w)} / ${w.limit} pts · ${w.characters.length} entries</div></div>
        <div class="acts">
          ${w.id === db.current ? `<span class="pill acc">Open</span>` : `<button class="btn sm" data-act="wb-open" data-v="${w.id}">Open</button>`}
          <button class="btn sm" data-act="wb-copy" data-v="${w.id}">Copy as text</button>
          ${ui.confirm === "wb:" + w.id ? `<button class="btn sm danger" data-act="wb-del-yes" data-v="${w.id}">Confirm</button>` : `<button class="btn sm danger" data-act="wb-del" data-v="${w.id}">Delete</button>`}
        </div></div>`).join("")}</div>
      <textarea class="input mono" id="export-box" readonly hidden style="min-height:120px;font-size:12px"></textarea>
    </div>
    <div class="sec">
      <div class="sec-h"><h2>Load a warband</h2></div>
      <p class="intro">Paste warband text someone copied from this builder.</p>
      <textarea class="input mono" id="import-box" style="min-height:160px;font-size:12px" placeholder='{"name":"…","characters":[…]}'></textarea>
      <div><button class="btn primary" data-act="wb-import">Load warband</button></div>
    </div>
  </div></div>`;
}

/* =====================================================================
   EVENTS
   ===================================================================== */
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 1800);
}
function refreshLight() {
  // update totals without a full re-render (keeps focus in text inputs)
  renderMeter();
  const w = wb();
  w.characters.forEach(c => { const el = document.querySelector(`[data-cost="${c.id}"]`); if (el) el.textContent = charCost(c); });
  const cc = $("#wb-checks");
  if (cc) cc.innerHTML = wbChecks().map(([lvl, m]) => `<div class="chk"><i class="dot ${lvl === "ok" ? "" : lvl === "bad" ? "bad" : "warn"}"></i><span>${esc(m)}</span></div>`).join("");
}
function applyFilter(kind) {
  const val = (kind === "trait" ? ui.traitFilter : ui.weapFilter).toLowerCase().trim();
  const scope = kind === "trait" ? "#list-trait [data-search]" : "[data-scroll='weap'] [data-search]";
  document.querySelectorAll(scope).forEach(el => el.hidden = val && !el.dataset.search.includes(val));
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act, v = b.dataset.v, w = wb(), c = ch();
  switch (act) {
    case "tab": ui.tab = v; ui.confirm = null; break;
    case "quote": ui.quote = (ui.quote + 1) % QUOTES.length; renderQuote(); return;
    case "select": ui.sel = v; ui.confirm = null; break;
    case "add-char": { const n = newCharacter(`Recruit ${w.characters.length + 1}`); w.characters.push(n); ui.sel = n.id; ui.tab = "build"; break; }
    case "dup": { const n = JSON.parse(JSON.stringify(c)); n.id = uid(); n.name = c.name + " (copy)"; w.characters.splice(w.characters.indexOf(c) + 1, 0, n); ui.sel = n.id; break; }
    case "del": ui.confirm = c.id; break;
    case "del-no": ui.confirm = null; break;
    case "del-yes": { const i = w.characters.indexOf(c); w.characters.splice(i, 1); ui.sel = w.characters[Math.max(0, i - 1)]?.id ?? null; ui.confirm = null; break; }
    case "squad": c.squad = b.checked; if (c.squad && c.size < RULES.squadMin) c.size = RULES.squadMin; break;
    case "size": c.size = Math.min(RULES.squadMax, Math.max(RULES.squadMin, c.size + +v)); break;
    case "skill": { const k = b.dataset.k; c.skills[k] = Math.min(RULES.skillMax, Math.max(RULES.skillMin, c.skills[k] + +v)); break; }
    case "hp": c.hp = Math.max(RULES.hpMin, c.hp + +v * RULES.hpStep); break;
    case "trait": c.traits = c.traits.includes(v) ? c.traits.filter(x => x !== v) : [...c.traits, v]; break;
    case "tmode": ui.traitMode = v; break;
    case "abil": c.abilities = c.abilities.includes(v) ? c.abilities.filter(x => x !== v) : [...c.abilities, v]; break;
    case "wmode": ui.weapMode = v; break;
    case "wadd": { const ex = c.weapons.find(x => x.id === v); if (ex) ex.qty++; else c.weapons.push({ id: v, qty: 1 }); toast(`${weaponById(v).name} added`); break; }
    case "wqty": { const x = c.weapons[+b.dataset.i]; x.qty += +v; if (x.qty <= 0) c.weapons.splice(+b.dataset.i, 1); break; }
    case "armour": c.armour = v; break;
    case "iqty": { const q = Math.max(0, (c.items[v] || 0) + +b.dataset.d); if (q) c.items[v] = q; else delete c.items[v]; break; }
    case "cwrule": ui.cw.rules = ui.cw.rules.includes(v) ? ui.cw.rules.filter(x => x !== v) : [...ui.cw.rules, v]; break;
    case "cwsave": {
      const f = ui.cw, k = cwCost(f);
      if (!f.name.trim()) { toast("Give the weapon a name first"); $("#cw-name")?.focus(); return; }
      if (!maxDamage(f.dmg)) { toast("Damage needs dice, like 2D6+2"); $("#cw-dmg")?.focus(); return; }
      w.customWeapons = w.customWeapons || [];
      w.customWeapons.push({ id: "cw-" + uid(), custom: true, name: f.name.trim(), type: [f.kind, ...f.keywords.split(",").map(s => s.trim()).filter(Boolean)].join(", "),
        hands: f.oneHanded ? 1 : 2, dmg: f.dmg.toUpperCase().replace(/\s+/g, ""), rules: [...f.rules], ammo: f.rules.includes("Reload") ? f.ammo : undefined, range: f.kind === "Melee" ? 0 : +f.range || 0, cost: k.total });
      toast(`${f.name.trim()} forged for ${k.total} credits`); ui.cw = blankCW(); break;
    }
    case "cwdel": w.customWeapons = w.customWeapons.filter(x => x.id !== v); w.characters.forEach(cc => cc.weapons = cc.weapons.filter(x => x.id !== v)); break;
    case "wb-new": { const n = newWarband(); db.warbands[n.id] = n; db.current = n.id; ui.sel = null; ui.tab = "build"; break; }
    case "wb-open": db.current = v; ui.sel = wb().characters[0]?.id ?? null; ui.tab = "build"; break;
    case "wb-del": ui.confirm = "wb:" + v; break;
    case "wb-del-yes": {
      delete db.warbands[v]; ui.confirm = null;
      if (!Object.keys(db.warbands).length) { const n = newWarband(); db.warbands[n.id] = n; }
      if (!db.warbands[db.current]) { db.current = Object.keys(db.warbands)[0]; ui.sel = wb().characters[0]?.id ?? null; }
      break;
    }
    case "wb-copy": {
      const text = JSON.stringify(db.warbands[v]);
      const box = $("#export-box"); box.hidden = false; box.value = text;
      try { navigator.clipboard.writeText(text).then(() => toast("Warband copied"), () => { box.select(); toast("Select and copy the text below"); }); }
      catch (err) { box.select(); toast("Select and copy the text below"); }
      return;
    }
    case "wb-import": {
      try {
        const d = JSON.parse($("#import-box").value);
        if (!d || !Array.isArray(d.characters)) throw 0;
        d.id = uid(); d.updated = Date.now(); d.limit = +d.limit || RULES.defaultLimit; d.customWeapons = d.customWeapons || [];
        d.characters.forEach(cc => { cc.id = cc.id || uid(); cc.items = cc.items || {}; cc.weapons = cc.weapons || []; cc.traits = (cc.traits || []).filter(n => TRAIT[n]); cc.abilities = (cc.abilities || []).filter(n => ABIL[n]); });
        db.warbands[d.id] = d; db.current = d.id; ui.sel = d.characters[0]?.id ?? null; ui.tab = "build"; toast(`Loaded ${d.name}`);
      } catch (err) { toast("That text isn't a warband from this builder"); return; }
      break;
    }
    default: return;
  }
  save(); render();
});

document.addEventListener("input", e => {
  const el = e.target, w = wb(), c = ch();
  if (el.dataset.bind) {
    if (el.dataset.bind === "wb-name") w.name = el.value;
    if (el.dataset.bind === "wb-limit") w.limit = Math.max(0, parseInt(el.value, 10) || 0);
    if (el.dataset.bind === "c-name") { c.name = el.value; const r = document.querySelector(`.rcard[aria-current="true"] .nm`); if (r && r.firstChild) r.firstChild.textContent = el.value || "Unnamed"; }
    if (el.dataset.bind === "c-bg") c.background = el.value;
    save(); refreshLight(); return;
  }
  if (el.dataset.filter) {
    if (el.dataset.filter === "trait") ui.traitFilter = el.value; else ui.weapFilter = el.value;
    applyFilter(el.dataset.filter); return;
  }
  if (el.dataset.cw) {
    const key = el.dataset.cw;
    ui.cw[key] = el.type === "checkbox" ? el.checked : el.value;
    if (key === "kind" || key === "oneHanded") { render(); return; }
    $("#cw-calc").innerHTML = cwCalc(cwCost(ui.cw));
  }
});
document.addEventListener("change", e => { if (e.target.dataset.cw === "kind" || e.target.dataset.cw === "ammo") { ui.cw[e.target.dataset.cw] = e.target.value; render(); } });

load(); render(); applyFilter("trait"); applyFilter("weap");
</script>
