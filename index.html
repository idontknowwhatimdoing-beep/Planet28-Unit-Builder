<title>Planet 28 Warband Builder</title>
<meta name="description" content="Build Planet 28 (2nd edition) warbands and vehicles, print character sheets and track campaigns.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: personnel-file console. Sticky points strip on top, roster rail on the left, dossier editor on the right; stacks on phones. */
:root {
  --bg: #E7EAEE;
  --panel: #F6F7F9;
  --panel-2: #EEF1F4;
  --ink: #18202C;
  --muted: #586274;
  --line: #C6CDD7;
  --accent: #B8460F;
  --accent-soft: #F3DCCD;
  --accent-ink: #FFFFFF;
  --good: #2C7A4B;
  --warn: #9A6412;
  --bad: #B42318;
  --font-display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1218; --panel: #161B24; --panel-2: #1C2230; --ink: #E4E8EE; --muted: #8E98AA;
    --line: #2A3242; --accent: #F0883A; --accent-soft: #3A2516; --accent-ink: #1A0F06;
    --good: #52C48A; --warn: #E2A84A; --bad: #F2705F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1218; --panel: #161B24; --panel-2: #1C2230; --ink: #E4E8EE; --muted: #8E98AA;
  --line: #2A3242; --accent: #F0883A; --accent-soft: #3A2516; --accent-ink: #1A0F06;
  --good: #52C48A; --warn: #E2A84A; --bad: #F2705F; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.5; padding-inline: 16px; padding-block: 0 48px; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .04em; margin: 0; text-wrap: balance; }
.num, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.wrap { max-width: 1240px; margin: 0 auto; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- top strip ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); margin-inline: -16px; padding: 12px 16px 10px; }
.top-inner { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; max-width: 1240px; margin: 0 auto; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-size: 30px; line-height: 1; font-weight: 700; letter-spacing: .06em; }
.brand h1 span { color: var(--accent); }
.brand .sub { font-family: var(--font-display); font-size: 16px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.meter { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.meter .pts { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 500; white-space: nowrap; }
.meter .pts small { font-size: 13px; color: var(--muted); }
.meter .pts.over { color: var(--bad); }
.bar { width: 180px; max-width: 40vw; height: 8px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.bar.over i { background: var(--bad); }
.credits { font-size: 13px; color: var(--muted); }
.credits b { font-family: var(--font-mono); color: var(--ink); font-weight: 500; }

.quote { max-width: 1240px; margin: 14px auto 0; font-style: italic; color: var(--muted); font-size: 14px; display: flex; gap: 10px; align-items: flex-start; }
.quote::before { content: ""; flex: 0 0 3px; align-self: stretch; background: var(--accent); border-radius: 2px; opacity: .6; }
.quote button { margin-left: auto; flex: none; }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 4px; margin: 16px auto 16px; max-width: 1240px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { background: none; border: 0; padding: 8px 14px; font-family: var(--font-display); text-transform: uppercase; letter-spacing: .08em; font-size: 16px; color: var(--muted); border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-size: 14px; line-height: 1.2; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); border-color: var(--line); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 3px 8px; font-size: 13px; }
.field { display: grid; gap: 4px; }
.field > span { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; }
.input, select.input, textarea.input { width: 100%; padding: 7px 10px; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel); }
textarea.input { resize: vertical; min-height: 70px; }
.input:focus { border-color: var(--accent); outline: none; }

/* ---------- build layout ---------- */
.build { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; max-width: 1240px; margin: 0 auto; align-items: start; }
@media (max-width: 860px) { .build { grid-template-columns: minmax(0, 1fr); } }

.rail { display: grid; gap: 12px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 96px); }
@media (max-width: 860px) { .rail { position: static; } }
.wb-head { display: grid; gap: 10px; padding: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.wb-head .row { display: grid; grid-template-columns: 1fr 96px; gap: 8px; }
.roster { display: grid; gap: 6px; }
.rcard { display: grid; grid-template-columns: 44px minmax(0,1fr) auto; gap: 2px 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); cursor: pointer; text-align: left; width: 100%; }
.rcard:hover { border-color: var(--muted); }
.rcard[aria-current="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.rcard .nm { font-weight: 600; overflow-wrap: anywhere; }
.rcard .c { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 14px; }
.rcard .av { grid-row: 1 / span 2; width: 44px; height: 44px; }
.rcard .line { grid-column: 2 / -1; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.pill { display: inline-block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; padding: 1px 6px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); font-family: var(--font-body); vertical-align: 1px; margin-left: 4px; }
.pill.acc { border-color: var(--accent); color: var(--accent); }
.checks { display: grid; gap: 6px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); font-size: 13px; }
.chk { display: flex; gap: 8px; align-items: flex-start; }
.dot { flex: none; width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; background: var(--good); }
.dot.warn { background: var(--warn); }
.dot.bad { background: var(--bad); }

/* ---------- dossier ---------- */
.dossier { display: grid; gap: 16px; min-width: 0; }
.sec { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 14px; min-width: 0; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.sec-h h2 { font-size: 20px; }
.sec-h .tot { font-family: var(--font-mono); font-size: 14px; color: var(--muted); }
.sec-h .tot b { color: var(--ink); font-weight: 500; }
.intro { font-size: 14px; color: var(--muted); max-width: 70ch; margin: 0; }
.id-grid { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: end; }
@media (max-width: 560px) { .id-grid { grid-template-columns: minmax(0,1fr); } }

.stats { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 760px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 420px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { border: 1px solid var(--line); border-radius: var(--r); padding: 8px 6px 6px; display: grid; justify-items: center; gap: 2px; background: var(--panel-2); }
.stat .lbl { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .1em; font-size: 13px; color: var(--muted); white-space: nowrap; }
.stat .val { font-family: var(--font-mono); font-size: 26px; font-weight: 500; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .val small { font-size: 13px; color: var(--muted); }
.stat .ctl { display: flex; gap: 4px; }
.stat .ctl button { width: 28px; height: 26px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-family: var(--font-mono); font-size: 15px; line-height: 1; }
.stat .ctl button:disabled { opacity: .35; cursor: default; }
.stat .ctl button:not(:disabled):hover { border-color: var(--accent); color: var(--accent); }
.stat .cost { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.stat.fixed { background: none; border-style: dashed; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 10px; border-radius: 99px; background: var(--accent-soft); border: 1px solid transparent; font-size: 13px; }
.chip .num { font-size: 12px; color: var(--muted); }
.chip button { border: 0; background: none; cursor: pointer; width: 20px; height: 20px; border-radius: 50%; color: var(--muted); line-height: 1; }
.chip button:hover { color: var(--bad); }
.empty { font-size: 13px; color: var(--muted); font-style: italic; }

.picker { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.picker-top { display: flex; gap: 8px; padding: 8px; border-bottom: 1px solid var(--line); background: var(--panel-2); align-items: center; flex-wrap: wrap; }
.picker-top .input { flex: 1 1 180px; padding: 5px 9px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 4px 10px; font-size: 13px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.list { max-height: 340px; overflow-y: auto; }
.opt { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; align-items: start; width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; }
.opt:last-child { border-bottom: 0; }
.opt:hover { background: var(--panel-2); }
.opt .box { width: 18px; height: 18px; border: 1.5px solid var(--muted); border-radius: 4px; margin-top: 2px; display: grid; place-items: center; font-size: 12px; color: var(--accent-ink); }
.opt.on .box { background: var(--accent); border-color: var(--accent); }
.opt .t { font-weight: 600; }
.opt .d { font-size: 13px; color: var(--muted); }
.opt .cst { font-family: var(--font-mono); font-size: 14px; white-space: nowrap; }
.neg { color: var(--good); }
.opt.blocked { opacity: .5; }

.eq-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.eq-wrap { overflow-x: auto; }
.eq-table th { text-align: left; font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--panel-2); position: sticky; top: 0; }
.eq-table td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.eq-table tr:last-child td { border-bottom: 0; }
.eq-table td.n { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.eq-table td.nm { font-weight: 600; white-space: nowrap; }
.eq-table .kw { font-size: 12px; color: var(--muted); }

.carried { display: grid; gap: 6px; }
.citem { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel-2); }
.citem .nm { font-weight: 600; }
.citem .meta { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--panel); }
.qty button { border: 0; background: none; width: 26px; height: 26px; cursor: pointer; font-family: var(--font-mono); }
.qty span { min-width: 24px; text-align: center; font-family: var(--font-mono); font-size: 13px; }
.sub-h { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .08em; font-size: 15px; color: var(--muted); margin: 4px 0 -4px; }

.armour-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.arm { text-align: left; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel-2); cursor: pointer; display: grid; gap: 2px; }
.arm:hover { border-color: var(--muted); }
.arm[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.arm .t { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.arm .t .num { font-weight: 400; font-size: 13px; }
.arm .d { font-size: 12px; color: var(--muted); }

.ledger { display: grid; gap: 4px; font-size: 14px; }
.ledger div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dotted var(--line); padding-bottom: 3px; }
.ledger div span:last-child { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.ledger .total { border-bottom: 0; font-weight: 600; padding-top: 6px; border-top: 1px solid var(--ink); font-size: 16px; }

.toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; user-select: none; }
.toggle input { width: 16px; height: 16px; accent-color: var(--accent); }

/* ---------- photos ---------- */
.av { border-radius: 4px; background: var(--panel-2); border: 1px solid var(--line); overflow: hidden; display: grid; place-items: center; color: var(--muted); font-family: var(--font-display); text-transform: uppercase; }
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.rcard .av { font-size: 18px; }
.photo { width: 128px; height: 128px; font-size: 40px; position: relative; }
.photo-wrap { display: grid; gap: 6px; justify-items: center; }
.photo-wrap .acts { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
.photo.drop { border: 2px dashed var(--accent); }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; font-size: 0; }
.id-wrap { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 560px) { .id-wrap { grid-template-columns: minmax(0, 1fr); justify-items: start; } }
.id-fields { display: grid; gap: 12px; min-width: 0; width: 100%; }
.sheet-top { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; }
.sheet-top .av { width: 88px; height: 88px; font-size: 30px; border-color: var(--ink); }

/* ---------- empty state ---------- */
.blank { text-align: center; padding: 48px 20px; border: 1px dashed var(--line); border-radius: var(--r); display: grid; gap: 12px; justify-items: center; color: var(--muted); }

/* ---------- sheets ---------- */
.sheets { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 16px; max-width: 1240px; margin: 0 auto; }
.sheet { background: var(--panel); border: 2px solid var(--ink); border-radius: 4px; padding: 14px 16px; display: grid; gap: 10px; break-inside: avoid; }
.sheet-h { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; border-bottom: 2px solid var(--ink); padding-bottom: 6px; flex-wrap: wrap; }
.sheet-h h3 { font-size: 22px; }
.sheet-h .num { font-size: 14px; }
.sstats { display: grid; grid-template-columns: repeat(7, 1fr); border: 1px solid var(--ink); }
.sstats div { text-align: center; padding: 4px 2px; border-right: 1px solid var(--ink); }
.sstats div:last-child { border-right: 0; }
.sstats .k { font-family: var(--font-display); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.sstats .v { font-family: var(--font-mono); font-size: 18px; font-weight: 500; }
.sblock .k { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .08em; font-size: 14px; }
.sblock ul { margin: 2px 0 0; padding-left: 18px; font-size: 13px; }
.sblock li { margin-bottom: 2px; }
.sblock p { margin: 2px 0 0; font-size: 13px; }
.lines { height: 54px; background: repeating-linear-gradient(to bottom, transparent 0 17px, var(--line) 17px 18px); }
.sheet .bg { font-style: italic; font-size: 13px; color: var(--muted); }
.sheets-bar { max-width: 1240px; margin: 0 auto 16px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }

/* ---------- armoury & saved ---------- */
.page { max-width: 1240px; margin: 0 auto; display: grid; gap: 16px; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .two { grid-template-columns: minmax(0, 1fr); } }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 480px) { .form-grid { grid-template-columns: minmax(0,1fr); } }
.calc { font-family: var(--font-mono); font-size: 13px; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 3px; }
.calc div { display: flex; justify-content: space-between; gap: 8px; }
.calc .total { border-top: 1px solid var(--line); padding-top: 5px; margin-top: 3px; font-weight: 500; font-size: 15px; }
.saved { display: grid; gap: 8px; }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
.srow[aria-current="true"] { border-color: var(--accent); }
.srow .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.note { font-size: 13px; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: var(--r); font-size: 14px; z-index: 50; }

/* ---------- roster extras ---------- */
.rail-h { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .1em; font-size: 14px; color: var(--muted); margin-top: 6px; }
.pill.warn { border-color: var(--warn); color: var(--warn); }
.pill.bad { border-color: var(--bad); color: var(--bad); }
.rcard.gone { opacity: .55; }
.rcard.gone .nm { text-decoration: line-through; text-decoration-thickness: 1px; }
.dot.info { background: var(--muted); }
.inj { color: var(--accent); font-weight: 500; }
.banner { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; padding: 12px 14px; border: 1px solid var(--warn); border-left-width: 4px; border-radius: var(--r); background: var(--panel); }
.banner.bad { border-color: var(--bad); }
.banner .acts, .acts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.warn-t { color: var(--warn); }

/* ---------- vehicle grid ---------- */
:root { --zone-s: #FFFFFF; --zone-m: #E3E8EE; --zone-l: #D3DAE3; --cell-on: #F3DCCD; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --zone-s: #202736; --zone-m: #1A202C; --zone-l: #141921; --cell-on: #3A2516; } }
:root[data-theme="dark"] { --zone-s: #202736; --zone-m: #1A202C; --zone-l: #141921; --cell-on: #3A2516; }
.vgrid-wrap { display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 760px) { .vgrid-wrap { grid-template-columns: minmax(0, 1fr); } }
.vgrid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 3px; padding: 3px; background: var(--ink); border-radius: 4px; }
.cell { aspect-ratio: 1; border: 0; border-radius: 2px; position: relative; cursor: pointer; padding: 2px; display: grid; place-items: center; align-content: center; gap: 1px; font-size: 11px; line-height: 1.1; min-width: 0; overflow: hidden; }
.cell.z-small { background: var(--zone-s); }
.cell.z-medium { background: var(--zone-m); }
.cell.z-large { background: var(--zone-l); }
.cell:hover { outline: 2px solid var(--accent); outline-offset: -2px; }

// Max potential damage of a dice expression, e.g. "2D10+4" -> 24, "1D4-1" -> 3
function maxDamage(expr) {
  const s = String(expr).toUpperCase().replace(/\s+/g, "");
  if (!s) return 0;
  let total = 0, ok = false;
  const re = /([+-]?)(\d*)D(\d+)|([+-]?)(\d+)/g;
  let m;
  while ((m = re.exec(s))) {
    ok = true;
    if (m[3]) total += (m[1] === "-" ? -1 : 1) * (parseInt(m[2] || "1", 10) * parseInt(m[3], 10));
    else total += (m[4] === "-" ? -1 : 1) * parseInt(m[5], 10);
  }
  return ok ? total : 0;
}

// Shrink a picked image to a 320px centre-cropped square JPEG so it fits in browser storage
function shrinkImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const S = 320, side = Math.min(img.naturalWidth, img.naturalHeight);
      const cv = document.createElement("canvas"); cv.width = cv.height = S;
      cv.getContext("2d").drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, S, S);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
    img.src = url;
  });
}

}

function costParts(c, w = wb()) {
  const skills = SKILLS.reduce((s, k) => s + (c.skills[k.k] - 1) * RULES.skillCost, 0);
  const hp = ((c.hp - RULES.hpStart) / RULES.hpStep) * RULES.hpStepCost;
  const traits = c.traits.reduce((s, n) => s + (TRAIT[n]?.cost || 0), 0);
  const abilities = c.abilities.reduce((s, n) => s + (ABIL[n]?.cost || 0), 0);
  const weapons = c.weapons.reduce((s, x) => s + (weaponById(x.id, w)?.cost || 0) * x.qty, 0);
  const armour = ARM[c.armour]?.cost || 0;
  const items = Object.entries(c.items).reduce((s, [id, q]) => s + (ITEM[id]?.cost || 0) * q, 0);
  const each = RULES.baseCost + skills + hp + traits + abilities + weapons + armour + items;
  const models = c.squad ? c.size : 1;
  return { base: RULES.baseCost, skills, hp, traits, abilities, weapons, armour, items, equipment: weapons + armour + items, each, models, total: each * models };
}
const unitCost = u => isV(u) ? vCost(u).total : costParts(u).total;
function wbTotal(w = wb()) { return allUnits(w).filter(u => !gone(u)).reduce((s, u) => s + (isV(u) ? vCost(u, w).total : costParts(u, w).total), 0); }
function modelCount(w = wb()) { return w.characters.filter(c => !gone(c)).reduce((s, c) => s + (c.squad ? c.size : 1), 0); }

function speedOf(c) {
  let s = RULES.speed; const notes = [];
  if (c.traits.includes("Big") || c.traits.includes("Gigantic")) s -= 3;
  if (c.traits.includes("Fast")) notes.push("+1D6");
  if (c.traits.includes("Slow")) notes.push("−1D6");
  return { s, notes };
}
// Profile after campaign injuries
function effective(c) {
  const sk = { ...c.skills }; let hp = c.hp; let sp = speedOf(c).s; const notes = [];
  (c.injuries || []).forEach(i => {
    if (i.n === 4) hp = Math.max(1, Math.floor(hp * 0.75));
    if (i.n === 6) { sp -= 3; if (i.dur > 0) { sk.A = Math.max(1, sk.A - (i.pen || 0)); notes.push(`−${i.pen} A for ${i.dur} more game${i.dur > 1 ? "s" : ""}`); } }
    if (i.n === 7) { sk.AW = Math.max(1, sk.AW - 2); sk.P = Math.max(1, sk.P - 2); }
    if (i.n === 5 && i.dur > 0) notes.push(`one 1-handed weapon only for ${i.dur} more game${i.dur > 1 ? "s" : ""}`);
    if (i.n === 3) notes.push("−1 (P) on break tests");
  });
  const changed = hp !== c.hp || sp !== speedOf(c).s || SKILLS.some(s => sk[s.k] !== c.skills[s.k]);
  return { skills: sk, hp, speed: sp, notes, changed };
}
function handsAvailable(c) {
  if (c.traits.includes("Armless")) return 1;
  if (c.traits.includes("Extra limbs")) return 4;
  return 2;
}
function isComplex(item) { return /complex/i.test(item?.type || ""); }

function charChecks(c) {
  const out = [];
  const t = n => c.traits.includes(n);
  if (t("Big") && t("Gigantic")) out.push(["warn", "Gigantic already includes all the effects of Big, so Big is paying twice."]);
  if (t("Blessed") && t("Cursed")) out.push(["warn", "Blessed and Cursed cancel out: one keeps the lowest of 2D10, the other the highest."]);
  if (t("Fast") && t("Slow")) out.push(["warn", "Fast and Slow both roll 1D6 against speed each turn."]);
  if (t("Brave") && t("Unshakable")) out.push(["warn", "Unshakable never takes break tests, so Brave's reroll does nothing."]);
  if (t("Coward") && t("Unshakable")) out.push(["warn", "Coward forces break tests that Unshakable never takes. Check with your opponent."]);
  if (t("Animal") && c.abilities.length) out.push(["bad", "Animal characters may not use any abilities."]);
  if (t("Animal") && c.weapons.some(x => /ranged/i.test(weaponById(x.id)?.type || ""))) out.push(["bad", "Animal characters may not perform shoot actions, so ranged weapons are wasted."]);
  if (t("Barbaric")) {
    const bad = c.weapons.map(x => weaponById(x.id)).filter(isComplex).map(x => x.name);
    if (bad.length) out.push(["bad", `Barbaric characters may not wield Complex weapons: ${bad.join(", ")}.`]);
  }
  if (t("Psychic") && !t("Minor arcana") && !t("Major arcana")) out.push(["warn", "Psychic rerolls failed arcana, but this character has no Minor or Major arcana."]);
  if (t("Minor arcana") && t("Major arcana")) out.push(["warn", "Minor and Major arcana both taken. Major already rolls 3 abilities."]);
  const hands = c.weapons.reduce((s, x) => s + (weaponById(x.id)?.hands || 1) * x.qty, 0);
  const av = handsAvailable(c);
  if (hands > av) out.push(["info", `Carrying ${hands} hands' worth of weapons with ${av} hand${av > 1 ? "s" : ""}. Swapping weapons takes an action.`]);
  const need = {};
  c.weapons.forEach(x => { const w = weaponById(x.id); if (w?.rules?.includes("Reload")) need[w.ammo || "any"] = w.name; });
  for (const [kind, wname] of Object.entries(need)) {
    if (kind === "any") { if (!["ammo-rough", "ammo-basic", "ammo-special"].some(i => c.items[i])) out.push(["warn", `${wname} has Reload but the character carries no ammo.`]); }
    else if (!c.items["ammo-" + kind]) out.push(["warn", `${wname} needs ${kind} ammo to reload, and the character carries none.`]);
  }
  if (c.hp <= 10) out.push(["info", `Only ${c.hp} hit-points. Skills drop by 1 once they lose half.`]);
  if (c.squad && (c.size < RULES.squadMin || c.size > RULES.squadMax)) out.push(["bad", `Squads must have ${RULES.squadMin} to ${RULES.squadMax} members.`]);
  return out;
}

/* =====================================================================
   VEHICLES
   Building grid: 7 rows × 6 columns, as on the vehicle character sheet (p.84).
   Small zone = rows 2–4, cols 2–3. Medium = rows 1–5, cols 1–4. Large = all.
   ===================================================================== */
const GRID_R = 7, GRID_C = 6;
const ZONES = { small: [2, 4, 2, 3], medium: [1, 5, 1, 4], large: [0, 6, 0, 5] };
function zoneOf(r, c) {
  const inZ = ([r0, r1, c0, c1]) => r >= r0 && r <= r1 && c >= c0 && c <= c1;
  return inZ(ZONES.small) ? "small" : inZ(ZONES.medium) ? "medium" : "large";
}
const ORDER = { small: 0, medium: 1, large: 2 };
function vSize(v) {
  let s = "small";
  Object.keys(v.cells).forEach(k => { const [r, c] = k.split("-").map(Number); const z = zoneOf(r, c); if (ORDER[z] > ORDER[s]) s = z; });
  return s;
}
// Facing from the X laid over the vehicle (p.37), using the bounding box of the vehicle's size on the grid
function facingOf(r, c, size) {
  if (size === "small") return null;
  const [r0, r1, c0, c1] = ZONES[size];
  const cy = (r0 + r1 + 1) / 2, cx = (c0 + c1 + 1) / 2, hy = (r1 + 1 - r0) / 2, hx = (c1 + 1 - c0) / 2;
  const dy = (r + 0.5 - cy) / hy, dx = (c + 0.5 - cx) / hx;
  if (Math.abs(dy) >= Math.abs(dx)) return dy < 0 ? "Front" : "Rear";
  return dx < 0 ? "Left" : "Right";
}
function vSections(v) { return Object.entries(v.cells).map(([k, id]) => ({ k, id, s: SECT[id] })).filter(x => x.s); }
function vCost(v, w = wb()) {
  const skills = (v.skills.A - VEHICLE.skillStart + v.skills.S - VEHICLE.skillStart) * VEHICLE.skillCost;
  const type = VTYPE[v.type]?.cost || 0;
  const sections = vSections(v).reduce((s, x) => s + x.s.cost, 0);
  const traits = v.traits.reduce((s, n) => s + (VTRAIT[n]?.cost || 0), 0);
  const abilities = v.abilities.reduce((s, n) => s + (VABIL[n]?.cost || 0), 0);
  const weapons = Object.entries(v.mounts).reduce((s, [k, id]) => s + (v.cells[k] && SECT[v.cells[k]]?.mount ? (weaponById(id, w)?.cost || 0) : 0), 0);
  const total = VEHICLE.baseCost + skills + type + sections + traits + abilities + weapons;
  return { base: VEHICLE.baseCost, skills, type, sections, traits, abilities, weapons, total };
}
function vStats(v) {
  const secs = vSections(v);
  const size = vSize(v);
  const hp = secs.reduce((s, x) => s + x.s.hp, 0);
  const crew = secs.filter(x => x.s.crew).length;
  const mounts = secs.filter(x => x.s.mount);
  const transport = secs.filter(x => x.id === "transport").length * 3;
  let speed = VTYPE[v.type].speed;
  return { size, hp, sections: secs.length, crew, mounts, transport, speed, fight: V_SIZES[size].fight, dmg: V_SIZES[size].dmg };
}
function vChecks(v) {
  const out = []; const st = vStats(v); const secs = vSections(v);
  const armour = secs.filter(x => x.id === "armour").length;
  const cap = st.size === "large" ? 0.25 : 0.5;
  if (armour > Math.floor(st.sections * cap)) out.push(["bad", `Too much armour plating: ${armour} of ${st.sections} sections. A ${st.size} vehicle may have at most ${Math.round(cap * 100)}% (${Math.floor(st.sections * cap)}).`]);
  secs.filter(x => x.id === "dozer").forEach(x => {
    const [r, c] = x.k.split("-").map(Number);
    if (st.size === "small") out.push(["bad", "Dozer blades may only be used on medium or large vehicles."]);
    else if (facingOf(r, c, st.size) !== "Front") out.push(["bad", "A dozer blade must be placed in the vehicle's front facing."]);
  });
  if (!st.crew) out.push(["warn", "No crew sections left, so this vehicle can't fire any weapons."]);
  const armed = st.mounts.filter(m => v.mounts[m.k]).length;
  if (st.mounts.length > armed) out.push(["info", `${st.mounts.length - armed} hard point${st.mounts.length - armed > 1 ? "s have" : " has"} no weapon mounted.`]);
  if (armed > st.crew && st.crew) out.push(["info", `${armed} weapons but ${st.crew} crew, so it fires ${st.crew} per shooting action.`]);
  if (v.traits.includes("Mercenary")) out.push(["info", "Mercenary vehicles can only act while a character with the Pilot trait is embarked."]);
  if (v.type === "flyer") out.push(["info", "Flyers must spend at least one action moving each turn, or land first."]);
  if (st.size !== "small") out.push(["info", `${V_SIZES[st.size].name} vehicles have facings. Damage from an attack goes to a section on the facing it came from.`]);
  return out;
}

function wbChecks(w = wb()) {
  const out = [];
  const total = wbTotal(w), models = modelCount(w);
  if (models < RULES.minCharacters) out.push(["bad", `A warband needs at least ${RULES.minCharacters} characters (has ${models}).`]);
  if (!w.campaign && total > w.limit) out.push(["bad", `${total - w.limit} points over the ${w.limit} point limit.`]);
  w.characters.filter(c => !gone(c)).forEach(c => charChecks(c).filter(x => x[0] === "bad").forEach(x => out.push(["bad", `${c.name || "Unnamed"}: ${x[1]}`])));
  w.vehicles.filter(v => !gone(v)).forEach(v => vChecks(v).filter(x => x[0] === "bad").forEach(x => out.push(["bad", `${v.name || "Unnamed"}: ${x[1]}`])));
  if (!out.length) out.push(["ok", w.campaign ? `Campaign under way · game ${w.campaign.games + 1} next.` : "Warband is legal and ready to deploy."]);
  return out;
}

/* =====================================================================
   CAMPAIGN: pending changes are paid in campaign points (CP) and credits
   ===================================================================== */
const charBuild = c => clone({ skills: c.skills, hp: c.hp, traits: c.traits, abilities: c.abilities, weapons: c.weapons, armour: c.armour, items: c.items });
const vehBuild = v => clone({ skills: v.skills, type: v.type, cells: v.cells, mounts: v.mounts, traits: v.traits, abilities: v.abilities });
const buildOf = u => isV(u) ? vehBuild(u) : charBuild(u);

function pending(u, w = wb()) {
  const cp = w.campaign; if (!cp || gone(u)) return null;
  const lines = []; let points = 0, credits = 0;
  if (u.draft) {
    if (isV(u)) {
      const k = vCost(u, w).total; points = k; lines.push(`New vehicle, ${k} pts`);
      return { points, credits, lines, pool: true, changed: true };
    }
    const p = costParts(u, w);
    const base = u.waived ? 0 : CAMPAIGN.recruitCP;
    points = base + p.skills + p.hp + p.traits + p.abilities; credits = p.equipment;
    lines.push(u.waived ? "Replacement recruit (no 10 CP fee)" : `Recruit fee ${base} CP`);
    if (p.skills) lines.push(`Skills ${p.skills}`); if (p.hp) lines.push(`Hit-points ${p.hp}`);
    if (p.traits) lines.push(`Traits ${p.traits}`); if (p.abilities) lines.push(`Abilities ${p.abilities}`);
    if (credits) lines.push(`Equipment ${credits} cr`);
    if (u.squad) { points *= u.size; credits *= u.size; lines.push(`× ${u.size} members`); }
    return { points: Math.max(0, points), credits, lines, pool: true, changed: true };
  }
  const s = u.snap; if (!s) return null;
  const changed = JSON.stringify(buildOf(u)) !== JSON.stringify(s);
  if (!changed) return null;
  const traitTable = isV(u) ? VTRAIT : TRAIT, abilTable = isV(u) ? VABIL : ABIL;
  const skillList = isV(u) ? [{ k: "A", name: "Agility" }, { k: "S", name: "Shooting" }] : SKILLS;
  const perSkill = isV(u) ? CAMPAIGN.vSkillCP : CAMPAIGN.skillCP;
  skillList.forEach(k => { const d = u.skills[k.k] - s.skills[k.k]; if (d > 0) { points += d * perSkill; lines.push(`+${d} ${k.name} (${d * perSkill} CP)`); } });
  u.traits.filter(t => !s.traits.includes(t)).forEach(t => { const c = Math.max(0, traitTable[t]?.cost || 0); points += c; lines.push(`${t} (${c} CP)`); });
  s.traits.filter(t => !u.traits.includes(t)).forEach(t => { const c = traitTable[t]?.cost || 0; if (c < 0) { points += -c; lines.push(`Lose ${t} (${-c} CP)`); } else lines.push(`Drop ${t} (no refund)`); });
  u.abilities.filter(a => !s.abilities.includes(a)).forEach(a => { const c = abilTable[a]?.cost || 0; points += c; lines.push(`${a} (${c} CP)`); });
  if (isV(u)) {
    if (u.type !== s.type && VTYPE[u.type].cost) { points += VTYPE[u.type].cost; lines.push(`${VTYPE[u.type].name} type (${VTYPE[u.type].cost} CP)`); }
    const count = cells => Object.values(cells).reduce((m, id) => (m[id] = (m[id] || 0) + 1, m), {});
    const now = count(u.cells), was = count(s.cells);
    Object.entries(now).forEach(([id, n]) => { const d = n - (was[id] || 0); if (d > 0 && SECT[id].cost) { points += d * SECT[id].cost; lines.push(`${d}× ${SECT[id].name} (${d * SECT[id].cost} CP)`); } });
    Object.entries(u.mounts).forEach(([k, id]) => { if (s.mounts[k] !== id && u.cells[k] && SECT[u.cells[k]]?.mount) { const wp = weaponById(id, w); if (wp) { points += wp.cost; lines.push(`${wp.name} (${wp.cost} CP)`); } } });
  } else {
    const d = u.hp - s.hp; if (d > 0) { const n = Math.ceil(d / CAMPAIGN.hpStep); points += n * CAMPAIGN.hpCP; lines.push(`+${d} hit-points (${n * CAMPAIGN.hpCP} CP)`); }
    const qty = list => list.reduce((m, x) => (m[x.id] = (m[x.id] || 0) + x.qty, m), {});
    const nw = qty(u.weapons), ow = qty(s.weapons);
    Object.entries(nw).forEach(([id, q]) => { const d = q - (ow[id] || 0); const wp = weaponById(id, w); if (d > 0 && wp) { credits += d * wp.cost; lines.push(`${d}× ${wp.name} (${d * wp.cost} cr)`); } });
    if (u.armour !== s.armour && ARM[u.armour].cost) { credits += ARM[u.armour].cost; lines.push(`${ARM[u.armour].name} (${ARM[u.armour].cost} cr)`); }
    Object.entries(u.items).forEach(([id, q]) => { const d = q - (s.items[id] || 0); if (d > 0) { credits += d * ITEM[id].cost; lines.push(`${d}× ${ITEM[id].name} (${d * ITEM[id].cost} cr)`); } });
    if (u.squad && credits) { credits *= u.size; lines.push(`Equipment × ${u.size} members`); }
  }
  if (!lines.length) lines.push("Removed things (no refund)");
  return { points, credits, lines, pool: false, changed: true };
}
function payPending(u) {
  const w = wb(), cp = w.campaign, p = pending(u); if (!p) return;
  let fromSalvage = 0;
  if (p.pool) {
    if (isV(u)) fromSalvage = Math.min(cp.salvage || 0, p.points);
    if (cp.pool + fromSalvage < p.points) { toast(`The warband pool has ${cp.pool} CP${fromSalvage ? ` (+${fromSalvage} salvage)` : ""}; this needs ${p.points}.`); return; }
  } else if ((u.cp || 0) < p.points) { toast(`${u.name} has ${u.cp || 0} CP; this needs ${p.points}.`); return; }
  if (cp.credits < p.credits) { toast(`The warband has ${cp.credits} credits; this needs ${p.credits}.`); return; }
  if (p.pool) { cp.salvage = (cp.salvage || 0) - fromSalvage; cp.pool -= p.points - fromSalvage; } else u.cp -= p.points;
  cp.credits -= p.credits;
  logLine(`${u.name}: ${u.draft ? "joined the warband" : "upgraded"}: ${p.lines.join(", ")}.`);
  u.draft = false; u.waived = false; u.snap = buildOf(u); u.cp = u.cp || 0;
  toast("Paid and confirmed");
}
function undoPending(u) {
  const w = wb();
  if (u.draft) {
    const list = isV(u) ? w.vehicles : w.characters; list.splice(list.indexOf(u), 1);
    ui.sel = firstUnit()?.id ?? null; toast(isV(u) ? "Vehicle discarded" : "Recruit discarded"); return;
  }
  Object.assign(u, clone(u.snap)); toast("Changes undone");
}
function logLine(text) { const cp = camp(); if (cp) cp.log.unshift({ game: cp.games, text }); }
function startCampaign() {
  const w = wb(), total = wbTotal(w);
  w.campaign = { games: 0, credits: Math.max(0, w.limit - total), pool: 0, salvage: 0, log: [] };
  allUnits(w).forEach(u => { u.snap = buildOf(u); u.cp = 0; u.injuries = []; u.damage = []; u.agenda = null; u.status = "active"; u.draft = false; u.outNext = false; u.pendingRoll = false; });
  logLine(`Campaign started with ${w.campaign.credits} credits left over from ${w.limit} points.`);
}
function endCampaign() {
  const w = wb();
  w.characters = w.characters.filter(c => !c.draft); w.vehicles = w.vehicles.filter(v => !v.draft);
  allUnits(w).forEach(u => { delete u.snap; delete u.cp; delete u.injuries; delete u.damage; delete u.agenda; delete u.status; delete u.draft; delete u.waived; delete u.outNext; delete u.pendingRoll; });
  w.campaign = null;
}
const agendaWorth = a => Math.max(0, 5 - (a?.fails || 0));
function applyInjury(c, n) {
  const cp = camp(), inj = INJURIES[n - 1];
  const entry = { id: uid(), n, name: inj.name, game: cp.games };
  if (c.traits.includes("Painless") && n !== 8) { logLine(`${c.name} rolled ${inj.name} but is Painless: complete recovery.`); c.pendingRoll = false; return; }
  if (n === 8 && c.traits.includes("Death-proof")) { logLine(`${c.name} rolled Death but is Death-proof: complete recovery.`); c.pendingRoll = false; return; }
  if (n === 1) { logLine(`${c.name}: complete recovery.`); c.pendingRoll = false; return; }
  if (n === 2) c.outNext = true;
  if (n === 5) entry.dur = roll(4);
  if (n === 6) { entry.dur = roll(4); entry.pen = roll(4); }
  if (n === 8) { c.status = "dead"; logLine(`${c.name} is dead.`); c.pendingRoll = false; return; }
  c.injuries = c.injuries || []; c.injuries.push(entry);
  logLine(`${c.name}: ${inj.name}${entry.dur ? ` (${entry.dur} game${entry.dur > 1 ? "s" : ""}${entry.pen ? `, −${entry.pen} A` : ""})` : ""}.`);
  c.pendingRoll = false;
}
function applyVDamage(v, n) {
  const cp = camp(), d = V_DAMAGE[n - 1];
  v.pendingRoll = false;
  if (n === 5) { logLine(`${v.name}: fully repaired.`); return; }
  if (n === 6) {
    const salvage = Math.floor(vCost(v).total / 2);
    v.status = "destroyed"; v.cp = 0; cp.salvage = (cp.salvage || 0) + salvage;
    logLine(`${v.name} is destroyed. ${salvage} pts of salvage toward a new vehicle.`); return;
  }
  if (n === 4) v.outNext = true;
  v.damage = v.damage || []; v.damage.push({ id: uid(), n, name: d.name, game: cp.games });
  logLine(`${v.name}: ${d.name}.`);
}

function render() {
  const keep = {};
  document.querySelectorAll("[data-scroll]").forEach(el => keep[el.dataset.scroll] = el.scrollTop);
  renderMeter(); renderQuote(); renderTabs();
  const app = $("#app");
  if (ui.tab === "build") app.innerHTML = viewBuild();
  else if (ui.tab === "sheets") app.innerHTML = viewSheets();
  else if (ui.tab === "campaign") app.innerHTML = viewCampaign();
  else if (ui.tab === "armoury") app.innerHTML = viewArmoury();
  else app.innerHTML = viewSaved();
  applyFilter("trait"); applyFilter("weap");
  document.querySelectorAll("[data-scroll]").forEach(el => { if (keep[el.dataset.scroll] != null) el.scrollTop = keep[el.dataset.scroll]; });
}

function renderMeter() {
  const w = wb(), total = wbTotal(w), cp = w.campaign;
  if (cp) {
    $("#meter").innerHTML = `<div class="pts num">${total} <small>pts value</small></div>
      <div class="credits"><b>${cp.credits}</b> credits · <b>${cp.pool}</b> CP in pool · game <b>${cp.games + 1}</b> next</div>`;
    return;
  }
  const over = total > w.limit;
  const pct = Math.min(100, (total / Math.max(1, w.limit)) * 100);
  const left = w.limit - total;
  const vcount = w.vehicles.length;
  $("#meter").innerHTML = `
    <div class="pts num ${over ? "over" : ""}">${total} <small>/ ${w.limit} pts</small></div>
    <div class="bar ${over ? "over" : ""}" role="img" aria-label="${Math.round(pct)}% of points spent"><i style="width:${pct}%"></i></div>
    <div class="credits">${over ? `<b style="color:var(--bad)">${-left}</b> over` : `<b>${left}</b> left → credits`} · <b>${modelCount(w)}</b> models${vcount ? ` · <b>${vcount}</b> vehicle${vcount > 1 ? "s" : ""}` : ""}</div>`;
}
function renderQuote() {
  const [q, src] = QUOTES[ui.quote];
  $("#quote").innerHTML = `<div>“${esc(q)}”${src ? ` <span class="muted" style="font-style:normal">— ${esc(src)}</span>` : ""}</div><button class="btn ghost sm" data-act="quote" aria-label="Another quote">↻</button>`;
}
function renderTabs() {
  const tabs = [["build", "Build"], ["sheets", "Sheets"], ["campaign", camp() ? "Campaign ●" : "Campaign"], ["armoury", "Custom weapons"], ["saved", "Saved warbands"]];
  $("#tabs").innerHTML = tabs.map(([k, l]) => `<button class="tab" role="tab" aria-selected="${ui.tab === k}" data-act="tab" data-v="${k}">${l}</button>`).join("");
}
const checkList = list => list.map(([lvl, m]) => `<div class="chk"><i class="dot ${lvl === "ok" ? "" : lvl === "bad" ? "bad" : lvl === "warn" ? "warn" : "info"}"></i><span>${esc(m)}</span></div>`).join("");

function rosterCard(u) {
  const cost = unitCost(u);
  const line = isV(u)
    ? (() => { const st = vStats(u); return `A${u.skills.A} S${u.skills.S} · ${V_SIZES[st.size].name} ${VTYPE[u.type].name.toLowerCase()} · ${st.hp}HP`; })()
    : `A${u.skills.A} S${u.skills.S} F${u.skills.F} P${u.skills.P} AW${u.skills.AW} · ${u.hp}HP`;
  const tags = [];
  if (!isV(u) && u.squad) tags.push(`<span class="pill acc">Squad ×${u.size}</span>`);
  if (u.draft) tags.push(`<span class="pill warn">Unpaid</span>`);
  else if (pending(u)) tags.push(`<span class="pill warn">Changes</span>`);
  if (u.status === "dead") tags.push(`<span class="pill bad">Dead</span>`);

  if (u.outNext) tags.push(`<span class="pill">Sits out</span>`);

}

    <label class="field"><span>Who are they?</span><textarea class="input" id="c-bg" data-bind="c-bg" placeholder="Who are they, why are they part of this warband, what are their strengths and weaknesses?">${esc(c.background)}</textarea></label>
    </div>
    </div>
    ${c.squad ? `<p class="intro">Squads move and act as one unit. Every member shares this profile and equipment, and the cost is the profile × members. If a squad drops to 2 members they become independent characters. At least 75% of members must carry the same weapons.</p>` : ""}
  </div>

  <div class="sec">
    <div class="sec-h"><h2>Profile</h2><span class="tot">${locked ? `+1 skill <b>${CAMPAIGN.skillCP} CP</b> · +${CAMPAIGN.hpStep} hit-points <b>${CAMPAIGN.hpCP} CP</b>` : `skills <b>${sgn(p.skills)}</b> · hit-points <b>${sgn(p.hp)}</b>`}</span></div>
    <div class="stats">
      ${SKILLS.map(s => `<div class="stat" title="${esc(s.d)}">
        <span class="lbl">${s.name.slice(0, 3)} (${s.k})</span>
        <span class="val">${c.skills[s.k]}${eff && eff.skills[s.k] !== c.skills[s.k] ? `<small class="inj"> ${eff.skills[s.k]}</small>` : ""}</span>
        <span class="ctl"><button data-act="skill" data-k="${s.k}" data-v="-1" ${c.skills[s.k] <= minSkill(s.k) ? "disabled" : ""} aria-label="Lower ${s.name}">−</button><button data-act="skill" data-k="${s.k}" data-v="1" ${c.skills[s.k] >= RULES.skillMax ? "disabled" : ""} aria-label="Raise ${s.name}">+</button></span>
        <span class="cost">${(c.skills[s.k] - 1) * RULES.skillCost} pts</span>
      </div>`).join("")}
      <div class="stat">
        <span class="lbl">Hit-points</span>
        <span class="val">${c.hp}${eff && eff.hp !== c.hp ? `<small class="inj"> ${eff.hp}</small>` : ""}</span>
        <span class="ctl"><button data-act="hp" data-v="-1" ${c.hp - hpStep < (locked ? c.snap.hp : RULES.hpMin) ? "disabled" : ""} aria-label="Lower hit-points">−</button><button data-act="hp" data-v="1" aria-label="Raise hit-points">+</button></span>
        <span class="cost">${locked ? `±${hpStep}` : `${sgn(p.hp)} pts`}</span>
      </div>
      <div class="stat fixed" title="Speed cannot be changed with points.">
        <span class="lbl">Speed</span>
        <span class="val">${sp.s}<small>cm</small>${eff && eff.speed !== sp.s ? `<small class="inj"> ${eff.speed}</small>` : ""}</span>
        <span class="cost" style="margin-top:4px">${sp.notes.length ? sp.notes.join(" ") + " / turn" : "fixed"}</span>
      </div>
    </div>
    ${eff && (eff.changed || eff.notes.length) ? `<p class="note" style="margin:0"><span class="inj">Small orange numbers</span> include injuries.${eff.notes.length ? " " + esc(eff.notes.join("; ")) + "." : ""}</p>` : ""}
  </div>

  <div class="sec">
    <div class="sec-h"><h2>Traits</h2><span class="tot"><b>${sgn(p.traits)}</b> pts</span></div>
    <div class="chips">${c.traits.length ? c.traits.map(n => `<span class="chip">${esc(n)} <span class="num ${TRAIT[n].cost < 0 ? "neg" : ""}">${sgn(TRAIT[n].cost)}</span><button data-act="trait" data-v="${esc(n)}" aria-label="Remove ${esc(n)}">×</button></span>`).join("") : `<span class="empty">No traits. Some traits have a negative cost and make the character cheaper.</span>`}</div>
    <div class="picker">
      <div class="picker-top">
        <input class="input" id="f-trait" data-filter="trait" placeholder="Search traits…" value="${esc(ui.traitFilter)}">
        <div class="seg">${[["all", "All"], ["pos", "Boons"], ["neg", "Drawbacks"]].map(([k, l]) => `<button data-act="tmode" data-v="${k}" aria-pressed="${ui.traitMode === k}">${l}</button>`).join("")}</div>
      </div>
      <div class="list" data-scroll="traits" id="list-trait">
        ${[...TRAITS].sort((a, b) => a.name.localeCompare(b.name)).filter(t => ui.traitMode === "all" || (ui.traitMode === "pos" ? t.cost > 0 : t.cost < 0)).map(t => {
          const on = c.traits.includes(t.name);
          return `<button class="opt ${on ? "on" : ""}" data-act="trait" data-v="${esc(t.name)}" data-search="${esc((t.name + " " + t.effect).toLowerCase())}">
            <span class="box">${on ? "✓" : ""}</span><span><span class="t">${esc(t.name)}</span><br><span class="d">${esc(t.effect)}</span></span><span class="cst ${t.cost < 0 ? "neg" : ""}">${sgn(t.cost)}</span></button>`;
        }).join("")}
      </div>
    </div>
  </div>

  <div class="sec">
    <div class="sec-h"><h2>Abilities</h2><span class="tot"><b>${sgn(p.abilities)}</b> pts</span></div>
    <p class="intro">Abilities are unique actions a character performs in place of their normal actions.</p>
    <div class="picker"><div class="list" data-scroll="abil">
      ${ABILITIES.map(a => {
        const on = c.abilities.includes(a.name);
        return `<button class="opt ${on ? "on" : ""} ${c.traits.includes("Animal") && !on ? "blocked" : ""}" data-act="abil" data-v="${esc(a.name)}">
          <span class="box">${on ? "✓" : ""}</span><span><span class="t">${esc(a.name)}</span><br><span class="d">${esc(a.effect)}</span></span><span class="cst">${sgn(a.cost)}</span></button>`;
      }).join("")}
    </div></div>
  </div>

  <div class="sec">
    <div class="sec-h"><h2>Equipment</h2><span class="tot"><b>${p.equipment}</b> credits${c.squad ? " each" : ""}</span></div>
    <p class="intro">${locked ? "During a campaign, new equipment is paid for with the warband's credits." : "During creation, points buy equipment 1 for 1 as credits. Anything left over when the warband is finished becomes credits."}</p>

    <div class="sub-h">Carried weapons</div>
    <div class="carried">
      ${c.weapons.length ? c.weapons.map((x, i) => {
        const wp = weaponById(x.id);
        if (!wp) return "";
        return `<div class="citem"><div style="min-width:0"><div class="nm">${esc(wp.name)}${wp.custom ? `<span class="pill acc">Custom</span>` : ""}</div>
          <div class="meta">${esc(wp.dmg)} · ${wp.range ? wp.range + "cm" : "melee"} · ${wp.hands === 2 ? "two" : "one"}-handed${wp.rules.length ? " · " + esc(wp.rules.join(", ")) : ""}</div></div>
          <div class="qty"><button data-act="wqty" data-i="${i}" data-v="-1" aria-label="Fewer">−</button><span>${x.qty}</span><button data-act="wqty" data-i="${i}" data-v="1" aria-label="More">+</button></div>
          <span class="num" style="min-width:42px;text-align:right">${wp.cost * x.qty}</span></div>`;
      }).join("") : `<span class="empty">Unarmed. Every character always has their fists (1D4-1).</span>`}
    </div>

    <div class="picker">
      <div class="picker-top">
        <input class="input" id="f-weap" data-filter="weap" placeholder="Search weapons…" value="${esc(ui.weapFilter)}">
        <div class="seg">${[["all", "All"], ["melee", "Melee"], ["ranged", "Ranged"]].map(([k, l]) => `<button data-act="wmode" data-v="${k}" aria-pressed="${ui.weapMode === k}">${l}</button>`).join("")}</div>
      </div>
      <div class="list eq-wrap" data-scroll="weap" style="max-height:300px">
        <table class="eq-table">
          <thead><tr><th>Weapon</th><th>Hands</th><th>Damage</th><th>Range</th><th>Special</th><th>Cost</th><th></th></tr></thead>
          <tbody>
          ${[...WEAPONS, ...(wb().customWeapons || [])].filter(wp => wp.id !== "fist" && (ui.weapMode === "all" || wp.type.toLowerCase().includes(ui.weapMode))).map(wp => `
            <tr data-search="${esc((wp.name + " " + wp.type + " " + wp.rules.join(" ")).toLowerCase())}">
              <td class="nm">${esc(wp.name)}${wp.custom ? `<span class="pill acc">Custom</span>` : ""}<div class="kw">${esc(wp.type)}</div></td>
              <td class="n">${wp.hands}</td><td class="n">${esc(wp.dmg)}</td><td class="n">${wp.range ? wp.range + "cm" : "—"}</td>
              <td>${wp.rules.length ? esc(wp.rules.join(", ")) + (wp.ammo ? `<div class="kw">Ammo: ${wp.ammo}</div>` : "") : "—"}</td>
              <td class="n">${wp.cost}</td>
              <td><button class="btn sm" data-act="wadd" data-v="${wp.id}">Add</button></td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </div>

    <div class="sub-h">Armour <span style="text-transform:none;letter-spacing:0;font-family:var(--font-body);font-size:13px">(one type only)</span></div>
    <div class="armour-grid">
      ${ARMOUR.map(a => `<button class="arm" data-act="armour" data-v="${a.id}" aria-pressed="${c.armour === a.id}">
        <span class="t">${esc(a.name)} <span class="num">${a.cost}</span></span>
        <span class="d"><span class="mono">Defence ${esc(a.def)}</span>${a.details ? " · " + esc(a.details) : ""}</span>
      </button>`).join("")}
    </div>

    <div class="sub-h">Ammo &amp; items</div>
    <div class="carried">
      ${ITEMS.map(it => {
        const q = c.items[it.id] || 0;
        return `<div class="citem" style="${q ? "" : "background:none"}"><div style="min-width:0"><div class="nm">${esc(it.name)} <span class="num muted" style="font-weight:400;font-size:13px">${it.cost} cr</span></div><div class="d muted" style="font-size:13px">${esc(it.d)}</div></div>
          <div class="qty"><button data-act="iqty" data-v="${it.id}" data-d="-1" ${q ? "" : "disabled"} aria-label="Fewer">−</button><span>${q}</span><button data-act="iqty" data-v="${it.id}" data-d="1" aria-label="More">+</button></div>
          <span class="num" style="min-width:42px;text-align:right">${it.cost * q}</span></div>`;
      }).join("")}
    </div>
  </div>

  <div class="two">
    <div class="sec">
      <div class="sec-h"><h2>Points</h2></div>
      <div class="ledger">
        <div><span>Base cost</span><span>${p.base}</span></div>
        <div><span>Skills</span><span>${p.skills}</span></div>
        <div><span>Hit-points</span><span>${p.hp}</span></div>
        <div><span>Traits</span><span>${p.traits}</span></div>
        <div><span>Abilities</span><span>${p.abilities}</span></div>
        <div><span>Weapons</span><span>${p.weapons}</span></div>
        <div><span>Armour</span><span>${p.armour}</span></div>
        <div><span>Ammo &amp; items</span><span>${p.items}</span></div>
        ${c.squad ? `<div><span>Per member</span><span>${p.each}</span></div><div><span>Members</span><span>× ${p.models}</span></div>` : ""}
        <div class="total"><span>${c.squad ? "Squad total" : "Character total"}</span><span>${p.total}</span></div>
      </div>
    </div>
    <div class="sec">
      <div class="sec-h"><h2>Notes</h2></div>
      <div style="display:grid;gap:8px;font-size:14px">
        ${checks.length ? checkList(checks) : checkList([["ok", "Nothing to flag on this character."]])}
      </div>
    </div>
  </div>`;
}

/* ---------- vehicle editor ---------- */
function viewVehicle(v) {
  const k = vCost(v), st = vStats(v), checks = vChecks(v);
  const cp = camp(), locked = cp && !v.draft;
  const minS = key => locked ? v.snap.skills[key] : VEHICLE.skillStart;
  const merc = v.traits.includes("Mercenary");
  const rangedWeapons = [...WEAPONS.filter(x => /ranged/i.test(x.type)), ...(wb().customWeapons || []).filter(x => /ranged/i.test(x.type))];
  const cells = [];
  for (let r = 0; r < GRID_R; r++) for (let c = 0; c < GRID_C; c++) {
    const key = `${r}-${c}`, id = v.cells[key], s = SECT[id], z = zoneOf(r, c), f = facingOf(r, c, st.size);
    const isCore = s?.core && !(merc && id === "crew-core");
    cells.push(`<button class="cell z-${z} ${s ? "filled" : ""} ${isCore ? "core" : ""}" data-act="cell" data-v="${key}" aria-label="${s ? s.name : "Empty"}${f ? ", " + f : ""}" title="${s ? esc(s.name + " · " + s.hp + "HP") : "Empty"}${f ? " · " + f : ""}">
      ${s ? `<span class="cn">${esc(s.short)}</span>${s.mount && v.mounts[key] ? `<span class="cw">${esc(weaponById(v.mounts[key])?.name || "")}</span>` : ""}` : ""}
      ${s && f ? `<span class="cf">${f[0]}</span>` : ""}
    </button>`);
  }
  return `${pendingBanner(v)}
  <div class="sec">
    <div class="sec-h"><h2>Vehicle</h2>${headerButtons(v)}</div>
    <div class="id-wrap">
      ${photoBlock(v)}
      <div class="id-fields">
        <label class="field"><span>Name</span><input class="input" id="v-name" data-bind="c-name" value="${esc(v.name)}"></label>
        <label class="field"><span>What is it, and who is it for?</span><textarea class="input" id="v-bg" data-bind="c-bg" placeholder="An armoured ground cruiser packed with corporate security? A camper-van with less than legal anti-grav engines?">${esc(v.background)}</textarea></label>
      </div>
    </div>
  </div>

  <div class="sec">
    <div class="sec-h"><h2>Profile</h2><span class="tot">${locked ? `+1 skill <b>${CAMPAIGN.vSkillCP} CP</b>` : `skills <b>${sgn(k.skills)}</b>`}</span></div>
    <div class="stats">
      ${[["A", "Agility"], ["S", "Shooting"]].map(([key, name]) => `<div class="stat">
        <span class="lbl">${name.slice(0, 3)} (${key})</span><span class="val">${v.skills[key]}</span>
        <span class="ctl"><button data-act="vskill" data-k="${key}" data-v="-1" ${v.skills[key] <= minS(key) ? "disabled" : ""} aria-label="Lower ${name}">−</button><button data-act="vskill" data-k="${key}" data-v="1" ${v.skills[key] >= VEHICLE.skillMax ? "disabled" : ""} aria-label="Raise ${name}">+</button></span>
        <span class="cost">${(v.skills[key] - 2) * 10} pts</span></div>`).join("")}
      <div class="stat fixed" title="Set by size"><span class="lbl">Fig (F)</span><span class="val">${st.fight}</span><span class="cost" style="margin-top:4px">${st.dmg} dmg</span></div>
      <div class="stat fixed"><span class="lbl">Speed</span><span class="val">${st.speed}<small>cm</small></span><span class="cost" style="margin-top:4px">${VTYPE[v.type].name}</span></div>
      <div class="stat fixed"><span class="lbl">Hit-points</span><span class="val">${st.hp}</span><span class="cost" style="margin-top:4px">${st.sections} sections</span></div>
      <div class="stat fixed"><span class="lbl">Size</span><span class="val" style="font-size:18px;padding-block:5px">${V_SIZES[st.size].name}</span><span class="cost" style="margin-top:4px">from the grid</span></div>
      <div class="stat fixed"><span class="lbl">Crew</span><span class="val">${st.crew}</span><span class="cost" style="margin-top:4px">${st.transport ? `carries ${st.transport}` : "weapons/action"}</span></div>
    </div>
  </div>

  <div class="sec">
    <div class="sec-h"><h2>Type</h2><span class="tot"><b>${sgn(k.type) || 0}</b> pts</span></div>
    <div class="armour-grid">
      ${V_TYPES.map(t => `<button class="arm" data-act="vtype" data-v="${t.id}" aria-pressed="${v.type === t.id}">
        <span class="t">${esc(t.name)} <span class="num">${t.cost ? "+" + t.cost : "free"} · ${t.speed}cm</span></span>
        <span class="d">${esc(t.effect)}</span></button>`).join("")}
    </div>
  </div>

  <div class="sec">
    <div class="sec-h"><h2>Building grid</h2><span class="tot">sections <b>${k.sections}</b> pts</span></div>
    <p class="intro">Pick a section, then tap squares to place it. Tap a placed section again to remove it. Up to 6 sections fit a small vehicle; filling the shaded ring makes it medium, and the outer ring makes it large. Letters show each section's facing.</p>
    <div class="vgrid-wrap">
      <div>
        <div class="vgrid" role="grid" aria-label="Vehicle building grid">${cells.join("")}</div>
        <div class="vgrid-legend"><span><i class="lg z-small"></i>Small</span><span><i class="lg z-medium"></i>Medium</span><span><i class="lg z-large"></i>Large</span></div>
      </div>
      <div class="palette" role="radiogroup" aria-label="Section to place">
        ${SECTIONS.filter(s => !s.core).map(s => `<button class="pal" role="radio" aria-checked="${ui.brush === s.id}" data-act="brush" data-v="${s.id}">
          <span class="t">${esc(s.name)}</span><span class="num">${s.cost} pts · ${s.hp}HP</span><span class="d">${esc(s.d)}</span></button>`).join("")}
        <button class="pal" role="radio" aria-checked="${ui.brush === "erase"}" data-act="brush" data-v="erase"><span class="t">Eraser</span><span class="d">Tap a section to clear it.</span></button>
        ${merc ? `<p class="note" style="margin:0">Mercenary: the core crew section can be painted over.</p>` : ""}
      </div>
    </div>
  </div>

  <div class="sec">
    <div class="sec-h"><h2>Weapons</h2><span class="tot"><b>${k.weapons}</b> pts</span></div>
    <p class="intro">Each hard point or turret mounts one weapon. Vehicles can mount any ranged weapon or a vehicle weapon, bought with points. A hard point fires from its own facing; a turret fires in any direction.</p>
    ${st.mounts.length ? `<div class="carried">${st.mounts.map(m => {
      const [r, c] = m.k.split("-").map(Number); const f = m.s.turret ? "any direction" : (facingOf(r, c, st.size) || "any direction");
      const cur = v.mounts[m.k] || "";
      return `<div class="citem mount"><div style="min-width:0"><div class="nm">${esc(m.s.name)} <span class="pill">${esc(f)}</span></div>
        <select class="input" id="mount-${m.k}" data-mount="${m.k}" aria-label="Weapon on ${esc(m.s.name)}">
          <option value="">— empty —</option>
          <optgroup label="Vehicle weapons">${V_WEAPONS.map(w => `<option value="${w.id}" ${cur === w.id ? "selected" : ""}>${esc(w.name)} · ${w.dmg} · ${w.rangeText || w.range + "cm"} · ${w.cost}</option>`).join("")}</optgroup>
          <optgroup label="Ranged weapons">${rangedWeapons.map(w => `<option value="${w.id}" ${cur === w.id ? "selected" : ""}>${esc(w.name)} · ${w.dmg} · ${w.range}cm · ${w.cost}</option>`).join("")}</optgroup>
        </select></div>
        <span class="num" style="min-width:42px;text-align:right">${cur ? weaponById(cur)?.cost || 0 : 0}</span></div>`;
    }).join("")}</div>` : `<p class="empty">No hard points yet. Place a Hard point or Turret hard point on the grid to mount a weapon.</p>`}
  </div>

  <div class="two">
    <div class="sec">
      <div class="sec-h"><h2>Traits</h2><span class="tot"><b>${sgn(k.traits) || 0}</b> pts</span></div>
      <div class="picker"><div class="list" data-scroll="vtraits">
        ${V_TRAITS.map(t => { const on = v.traits.includes(t.name); return `<button class="opt ${on ? "on" : ""}" data-act="vtrait" data-v="${esc(t.name)}"><span class="box">${on ? "✓" : ""}</span><span><span class="t">${esc(t.name)}</span><br><span class="d">${esc(t.effect)}</span></span><span class="cst ${t.cost < 0 ? "neg" : ""}">${sgn(t.cost)}</span></button>`; }).join("")}
      </div></div>
    </div>
    <div class="sec">
      <div class="sec-h"><h2>Abilities</h2><span class="tot"><b>${k.abilities}</b> pts</span></div>
      <div class="picker"><div class="list">
        ${V_ABILITIES.map(a => { const on = v.abilities.includes(a.name); return `<button class="opt ${on ? "on" : ""}" data-act="vabil" data-v="${esc(a.name)}"><span class="box">${on ? "✓" : ""}</span><span><span class="t">${esc(a.name)}</span><br><span class="d">${esc(a.effect)}</span></span><span class="cst">${sgn(a.cost)}</span></button>`; }).join("")}
      </div></div>
    </div>
  </div>

  <div class="two">
    <div class="sec">
      <div class="sec-h"><h2>Points</h2></div>
      <div class="ledger">
        <div><span>Base cost</span><span>${k.base}</span></div>
        <div><span>Skills</span><span>${k.skills}</span></div>
        <div><span>Type</span><span>${k.type}</span></div>
        <div><span>Sections</span><span>${k.sections}</span></div>
        <div><span>Traits</span><span>${k.traits}</span></div>
        <div><span>Abilities</span><span>${k.abilities}</span></div>
        <div><span>Weapons</span><span>${k.weapons}</span></div>
        <div class="total"><span>Vehicle total</span><span>${k.total}</span></div>
      </div>
    </div>
    <div class="sec">
      <div class="sec-h"><h2>Notes</h2></div>
      <div style="display:grid;gap:8px;font-size:14px">${checks.length ? checkList(checks) : checkList([["ok", "Nothing to flag on this vehicle."]])}</div>
    </div>
  </div>`;
}

/* ---------- sheets ---------- */
function viewSheets() {
  const w = wb(), cp = w.campaign;
  if (!allUnits(w).length) return `<div class="page">${viewBlank()}</div>`;
  const charSheets = w.characters.filter(c => !gone(c)).map(c => {
    const p = costParts(c), sp = speedOf(c), eff = cp ? effective(c) : { skills: c.skills, hp: c.hp, speed: sp.s, notes: [] };
    const arcana = c.traits.includes("Minor arcana") || c.traits.includes("Major arcana");
    const eq = [
      ...c.weapons.map(x => { const wp = weaponById(x.id); return wp ? `${x.qty > 1 ? x.qty + "× " : ""}<b>${esc(wp.name)}</b> <span class="mono">${esc(wp.dmg)}${wp.range ? " · " + wp.range + "cm" : ""}</span>${wp.rules.length ? " · " + esc(wp.rules.join(", ")) : ""}` : ""; }),
      `<b>${esc(ARM[c.armour].name)}</b> <span class="mono">def ${esc(ARM[c.armour].def)}</span>`,
      ...Object.entries(c.items).filter(([, q]) => q).map(([id, q]) => `${q}× ${esc(ITEM[id].name)}`),
    ];
    return `<article class="sheet">
      <div class="sheet-h"><h3>${esc(c.name || "Unnamed")}${c.squad ? ` <span class="pill acc">Squad ×${c.size}</span>` : ""}</h3><span class="num">Points cost: <b>${p.total}</b>${c.squad ? ` <span class="muted">(${p.each} each)</span>` : ""}</span></div>
      ${c.photo || c.background ? `<div class="sheet-top">${c.photo ? avatar(c) : ""}${c.background ? `<div class="bg">${esc(c.background)}</div>` : ""}</div>` : ""}
      <div class="sstats">

      return `<li><b>${esc(wp.name)}</b> <span class="mono">${esc(wp.dmg)} · ${wp.rangeText || wp.range + "cm"}</span>${wp.rules.length ? " · " + esc(wp.rules.join(", ")) : ""} <span class="muted">(${m.s.turret ? "turret" : facingOf(r, c, st.size) || "hard point"})</span></li>`;
    });
    return `<article class="sheet">
      <div class="sheet-h"><h3>${esc(v.name || "Unnamed")} <span class="pill">Vehicle</span></h3><span class="num">Points cost: <b>${k.total}</b></span></div>

      <div class="sstats">

          <div class="sblock"><div class="k">Abilities</div>${v.abilities.length ? `<ul>${v.abilities.map(n => `<li><b>${esc(n)}.</b> ${esc(VABIL[n].effect)}</li>`).join("")}</ul>` : `<p class="muted">None</p>`}</div>

      <div class="sblock"><div class="k">Sections</div><p>${vSections(v).map(x => { const [r, c] = x.k.split("-").map(Number); const f = facingOf(r, c, st.size); return `${esc(x.s.name)} <span class="mono">${x.s.hp}HP</span>${f ? ` <span class="muted">${f}</span>` : ""}`; }).join(" · ")}</p></div>

  });
  return `<div class="sheets-bar"><h2 style="font-size:22px">${esc(w.name)}</h2><span class="note">${wbTotal(w)}${cp ? " pts value" : ` / ${w.limit} pts`} · ${modelCount(w)} models · Hosted outside Claude, Ctrl/Cmd+P prints these sheets.</span></div>

}

    ${!v ? `<div class="cc-sec"><div class="k">Hidden agenda</div>${u.agenda ? `<div><b>${esc(AGENDAS[u.agenda.n - 1].name)}</b> <span class="note">worth ${agendaWorth(u.agenda)} CP</span><div class="note">${esc(AGENDAS[u.agenda.n - 1].effect)}</div></div><div class="acts"><button class="btn sm ghost" data-act="agenda-drop" data-v="${u.id}">Drop agenda</button></div>` : `<div class="acts"><button class="btn sm" data-act="agenda-roll" data-v="${u.id}">Roll 1D6 for an agenda</button></div>`}</div>` : ""}

function viewRecord() {
  const w = wb(), r = ui.rec;
  const chars = w.characters.filter(c => !gone(c) && !c.draft), vehs = w.vehicles.filter(v => !gone(v) && !v.draft);
  const num = (id, f, v = 0) => `<input class="input num sm" type="number" min="0" id="rec-${id}-${f}" data-rec="${id}:${f}" value="${r.u[id]?.[f] ?? v}" aria-label="${f}">`;
  const box = (id, f, label) => `<label class="toggle"><input type="checkbox" id="rec-${id}-${f}" data-rec="${id}:${f}" ${r.u[id]?.[f] ? "checked" : ""}> ${label}</label>`;
  const mercs = chars.filter(c => c.traits.includes("Mercenary") && !c.outNext);
  return `<div class="sec rec">
    <div class="sec-h"><h2>Record game ${camp().games + 1}</h2><button class="btn sm ghost" data-act="rec-close">Cancel</button></div>
    <p class="intro">Fill in what each character did. Characters earn 1 CP per successful shoot or fight action, 5 per enemy killed, 1 for surviving and 5 for finishing unwounded. Anyone killed rolls on the injury table afterwards.</p>
    <div class="eq-wrap"><table class="eq-table rec-table">
      <thead><tr><th>Character</th><th>Hits</th><th>Kills</th><th>Survived</th><th>Unwounded</th><th>Agenda done</th><th>Killed</th></tr></thead>
      <tbody>${chars.map(c => c.outNext ? `<tr><td class="nm">${esc(c.name)}</td><td colspan="6" class="note">Sitting this game out (out of action).</td></tr>` : `<tr>
        <td class="nm">${esc(c.name)}</td><td>${num(c.id, "hits")}</td><td>${num(c.id, "kills")}</td>
        <td>${box(c.id, "surv", "")}</td><td>${box(c.id, "unw", "")}</td>
        <td>${c.agenda ? box(c.id, "agenda", `${agendaWorth(c.agenda)}`) : `<span class="note">—</span>`}</td><td>${box(c.id, "killed", "")}</td></tr>`).join("")}</tbody>
    </table></div>
    ${vehs.length ? `<div class="eq-wrap"><table class="eq-table rec-table">
      <thead><tr><th>Vehicle</th><th>Kills</th><th>Sections destroyed</th><th>Survived</th><th>No sections lost</th><th>Derelict / destroyed</th></tr></thead>
      <tbody>${vehs.map(v => v.outNext ? `<tr><td class="nm">${esc(v.name)}</td><td colspan="5" class="note">In for slow repairs.</td></tr>` : `<tr>
        <td class="nm">${esc(v.name)}</td><td>${num(v.id, "kills")}</td><td>${num(v.id, "secs")}</td>
        <td>${box(v.id, "surv", "")}</td><td>${box(v.id, "noloss", "")}</td><td>${box(v.id, "wreck", "")}</td></tr>`).join("")}</tbody>
    </table></div>` : ""}
    <div class="rec-war">
      ${box("w", "goal", "Achieved the scenario goal (+10 CP to the pool)")}
      ${box("w", "half", "Destroyed 50% or more of the enemy warband (+10 CP to the pool)")}
      ${mercs.length ? box("w", "paid", `Paid mercenaries before the game (−${mercs.length * 10} credits): ${mercs.map(m => esc(m.name)).join(", ")}`) : ""}
    </div>
    <div><button class="btn primary" data-act="rec-save">Save game results</button></div>
  </div>`;
}
function saveRecord() {
  const w = wb(), cp = w.campaign, r = ui.rec;
  const lines = [];
  const g = r.u.w || {};
  const get = (id, f) => r.u[id]?.[f];
  w.characters.filter(c => !gone(c) && !c.draft).forEach(c => {
    if (c.outNext) { c.outNext = false; lines.push(`${c.name} sat out`); return; }
    if (c.traits.includes("Mercenary") && !g.paid) { lines.push(`${c.name} was not paid`); }
    let n = (+get(c.id, "hits") || 0) + 5 * (+get(c.id, "kills") || 0) + (get(c.id, "surv") ? 1 : 0) + (get(c.id, "unw") ? 5 : 0);
    if (c.agenda) {
      if (get(c.id, "agenda")) {
        const worth = agendaWorth(c.agenda);
        if (c.agenda.n === 6) { cp.pool += worth; lines.push(`${c.name}'s honourable death: +${worth} CP to the pool`); }
        else n += worth;
        c.agenda = null;
      } else c.agenda.fails = (c.agenda.fails || 0) + 1;
    }
    c.cp = (c.cp || 0) + n;
    lines.push(`${c.name} +${n} CP`);
    if (get(c.id, "killed")) c.pendingRoll = true;
    if (c.traits.includes("Rich")) { const cr = roll(8); cp.credits += cr; lines.push(`${c.name} is Rich: +${cr} credits`); }
    (c.injuries || []).forEach(i => { if (i.dur > 0) i.dur--; });
  });
  w.vehicles.filter(v => !gone(v) && !v.draft).forEach(v => {
    if (v.outNext) { v.outNext = false; lines.push(`${v.name} was in repairs`); return; }
    const n = 5 * (+get(v.id, "kills") || 0) + (+get(v.id, "secs") || 0) + (get(v.id, "surv") ? 1 : 0) + (get(v.id, "noloss") ? 5 : 0);
    v.cp = (v.cp || 0) + n; lines.push(`${v.name} +${n} CP`);
    if (get(v.id, "wreck")) v.pendingRoll = true;
  });
  if (g.goal) { cp.pool += 10; lines.push("Scenario goal +10 CP to the pool"); }
  if (g.half) { cp.pool += 10; lines.push("Enemy broken +10 CP to the pool"); }
  const mercs = w.characters.filter(c => !gone(c) && c.traits.includes("Mercenary"));
  if (g.paid && mercs.length) { cp.credits -= mercs.length * 10; lines.push(`Paid mercenaries ${mercs.length * 10} credits`); }
  cp.games += 1;
  cp.log.unshift({ game: cp.games, text: `Game ${cp.games} recorded. ${lines.join("; ")}.` });
  ui.rec = null;
  toast(`Game ${cp.games} recorded`);
}

/* ---------- custom weapons ---------- */
function blankCW() { return { name: "", kind: "Ranged", keywords: "", dmg: "2D6", range: 20, oneHanded: false, rules: [], ammo: "basic" }; }
function cwCost(f) {
  const md = maxDamage(f.dmg), rng = f.kind === "Melee" ? 0 : Math.max(0, +f.range || 0);
  const oh = f.oneHanded ? 10 : 0;
  const sp = f.rules.reduce((s, n) => s + (SPEC[n]?.cost || 0), 0);
  return { md, rng, oh, sp, total: md + rng + oh + sp };
}

  return `<div class="page"><div class="two">

      </div>
      <div class="sub-h">Special rules</div>
