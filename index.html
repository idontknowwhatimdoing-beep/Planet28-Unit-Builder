        ${SPECIALS.map(s => { const on = f.rules.includes(s.name); return `<button class="opt ${on ? "on" : ""}" data-act="cwrule" data-v="${esc(s.name)}"><span class="box">${on ? "✓" : ""}</span><span><span class="t">${esc(s.name)}</span><br><span class="d">${esc(s.effect)}</span></span><span class="cst ${s.cost < 0 ? "neg" : ""}">${sgn(s.cost)}</span></button>`; }).join("")}
      </div></div>
      ${f.rules.includes("Reload") ? `<label class="field"><span>Ammo type</span><select class="input" id="cw-ammo" data-cw="ammo">${["rough", "basic", "special"].map(o => `<option ${f.ammo === o ? "selected" : ""}>${o}</option>`).join("")}</select></label>` : ""}
      <div class="calc" id="cw-calc">${cwCalc(k)}</div>
      <div><button class="btn primary" data-act="cwsave">Add to warband armoury</button></div>
    </div>
    <div class="sec">
      <div class="sec-h"><h2>${esc(w.name)} armoury</h2></div>
      ${(w.customWeapons || []).length ? `<div class="carried">${w.customWeapons.map(cw => `<div class="citem"><div style="min-width:0"><div class="nm">${esc(cw.name)}</div><div class="meta">${esc(cw.type)} · ${esc(cw.dmg)} · ${cw.range ? cw.range + "cm" : "melee"} · ${cw.hands === 2 ? "two" : "one"}-handed${cw.rules.length ? " · " + esc(cw.rules.join(", ")) : ""}</div></div><span class="num">${cw.cost} cr</span><button class="btn sm danger" data-act="cwdel" data-v="${cw.id}">Remove</button></div>`).join("")}</div>
      <p class="note">Custom weapons appear in every character's weapon list for this warband, and ranged ones can be mounted on vehicles.</p>` : `<p class="empty">No custom weapons yet. Forged weapons are saved with this warband and show up in the weapon list on the Build tab.</p>`}
    </div>
  </div></div>`;
}
function cwCalc(k) {
  return `<div><span>Max damage</span><span>${k.md}</span></div><div><span>Range</span><span>${k.rng}</span></div><div><span>One-handed</span><span>${k.oh}</span></div><div><span>Special rules</span><span>${sgn(k.sp) || 0}</span></div><div class="total"><span>Cost</span><span>${k.total} credits</span></div>`;
}

/* ---------- saved ---------- */
function viewSaved() {
  const list = Object.values(db.warbands).sort((a, b) => b.updated - a.updated);
  return `<div class="page"><div class="two">
    <div class="sec">
      <div class="sec-h"><h2>Your warbands</h2><button class="btn primary sm" data-act="wb-new">+ New warband</button></div>
      <p class="intro">Warbands are kept in this browser. To move one to another device or hand it to a friend, copy it as text and load it on the other side. Campaign progress travels with it.</p>
      <div class="saved">${list.map(w => `<div class="srow" aria-current="${w.id === db.current}">
        <div style="min-width:0"><div style="font-weight:600">${esc(w.name)}${w.campaign ? ` <span class="pill acc">Campaign · ${w.campaign.games} games</span>` : ""}</div><div class="note num">${wbTotal(w)}${w.campaign ? " pts value" : ` / ${w.limit} pts`} · ${w.characters.length} characters${w.vehicles.length ? ` · ${w.vehicles.length} vehicles` : ""}</div></div>
        <div class="acts">
          ${w.id === db.current ? `<span class="pill acc">Open</span>` : `<button class="btn sm" data-act="wb-open" data-v="${w.id}">Open</button>`}
          <button class="btn sm" data-act="wb-copy" data-v="${w.id}">Copy as text</button>
          ${ui.confirm === "wb:" + w.id ? `<button class="btn sm danger" data-act="wb-del-yes" data-v="${w.id}">Confirm</button>` : `<button class="btn sm danger" data-act="wb-del" data-v="${w.id}">Delete</button>`}
        </div></div>`).join("")}</div>
      <textarea class="input mono" id="export-box" readonly hidden style="min-height:120px;font-size:12px"></textarea>
    </div>
    <div class="sec">
      <div class="sec-h"><h2>Load a warband</h2></div>
      <p class="intro">Paste warband text someone copied from this builder.</p>
      <textarea class="input mono" id="import-box" style="min-height:160px;font-size:12px" placeholder='{"name":"…","characters":[…]}'></textarea>
      <div><button class="btn primary" data-act="wb-import">Load warband</button></div>
    </div>
  </div></div>`;
}

/* =====================================================================
   EVENTS
   ===================================================================== */
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2200);
}
function refreshLight() {
  renderMeter();
  allUnits().forEach(u => { const el = document.querySelector(`[data-cost="${u.id}"]`); if (el) el.textContent = gone(u) ? "—" : unitCost(u); });
  const cc = $("#wb-checks");
  if (cc) cc.innerHTML = checkList(wbChecks());
}
function applyFilter(kind) {
  const val = (kind === "trait" ? ui.traitFilter : ui.weapFilter).toLowerCase().trim();
  const scope = kind === "trait" ? "#list-trait [data-search]" : "[data-scroll='weap'] [data-search]";
  document.querySelectorAll(scope).forEach(el => el.hidden = val && !el.dataset.search.includes(val));
}
const toggleIn = (arr, v) => arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v];

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act, v = b.dataset.v, w = wb(), u = sel(), c = ch(), vv = veh(), cp = w.campaign;
  switch (act) {
    case "tab": ui.tab = v; ui.confirm = null; break;
    case "quote": ui.quote = (ui.quote + 1) % QUOTES.length; renderQuote(); return;
    case "select": ui.sel = v; ui.confirm = null; break;
    case "goto": ui.sel = v; ui.tab = "build"; ui.confirm = null; window.scrollTo(0, 0); break;
    case "add-char": { const n = newCharacter(cp ? "New recruit" : `Recruit ${w.characters.length + 1}`); if (cp) { Object.assign(n, { draft: true, cp: 0, injuries: [], status: "active" }); } w.characters.push(n); ui.sel = n.id; ui.tab = "build"; break; }
    case "add-veh": { const n = newVehicle(`Vehicle ${w.vehicles.length + 1}`); if (cp) Object.assign(n, { draft: true, cp: 0, damage: [], status: "active" }); w.vehicles.push(n); ui.sel = n.id; ui.tab = "build"; break; }
    case "dup": { const n = clone(u); n.id = uid(); n.name = u.name + " (copy)"; const list = isV(u) ? w.vehicles : w.characters; list.splice(list.indexOf(u) + 1, 0, n); ui.sel = n.id; break; }
    case "del": ui.confirm = u.id; break;
    case "del-no": ui.confirm = null; break;
    case "del-yes": { const list = isV(u) ? w.vehicles : w.characters; const i = list.indexOf(u); list.splice(i, 1); ui.sel = (list[Math.max(0, i - 1)] || firstUnit())?.id ?? null; ui.confirm = null; break; }
    case "photo-del": u.photo = null; break;
    // character
    case "squad": c.squad = b.checked; if (c.squad && c.size < RULES.squadMin) c.size = RULES.squadMin; break;
    case "size": c.size = Math.min(RULES.squadMax, Math.max(RULES.squadMin, c.size + +v)); break;
    case "skill": { const k = b.dataset.k; c.skills[k] = Math.min(RULES.skillMax, Math.max(RULES.skillMin, c.skills[k] + +v)); break; }
    case "hp": { const step = cp && !c.draft ? CAMPAIGN.hpStep : RULES.hpStep; c.hp = Math.max(RULES.hpMin, c.hp + +v * step); break; }
    case "trait": c.traits = toggleIn(c.traits, v); break;
    case "tmode": ui.traitMode = v; break;
    case "abil": c.abilities = toggleIn(c.abilities, v); break;
    case "wmode": ui.weapMode = v; break;
    case "wadd": { const ex = c.weapons.find(x => x.id === v); if (ex) ex.qty++; else c.weapons.push({ id: v, qty: 1 }); toast(`${weaponById(v).name} added`); break; }
    case "wqty": { const x = c.weapons[+b.dataset.i]; x.qty += +v; if (x.qty <= 0) c.weapons.splice(+b.dataset.i, 1); break; }
    case "armour": c.armour = v; break;
    case "iqty": { const q = Math.max(0, (c.items[v] || 0) + +b.dataset.d); if (q) c.items[v] = q; else delete c.items[v]; break; }
    // vehicle
    case "vskill": { const k = b.dataset.k; vv.skills[k] = Math.min(VEHICLE.skillMax, Math.max(VEHICLE.skillStart, vv.skills[k] + +v)); break; }
    case "vtype": vv.type = v; break;
    case "brush": ui.brush = v; break;
    case "cell": {
      const cur = vv.cells[v], merc = vv.traits.includes("Mercenary");
      if (cur === "engine" || (cur === "crew-core" && !merc)) { toast(cur === "engine" ? "The engine is a core section and can't be removed" : "The crew is a core section. The Mercenary trait lets you replace it."); return; }
      if (ui.brush === "erase" || cur === ui.brush) { delete vv.cells[v]; delete vv.mounts[v]; }
      else { vv.cells[v] = ui.brush; if (!SECT[ui.brush].mount) delete vv.mounts[v]; }
      break;
    }
    case "vtrait": {
      vv.traits = toggleIn(vv.traits, v);
      if (v === "Mercenary" && !vv.traits.includes("Mercenary")) { vv.cells["2-3"] = "crew-core"; delete vv.mounts["2-3"]; }
      break;
    }
    case "vabil": vv.abilities = toggleIn(vv.abilities, v); break;
    // campaign
    case "camp-start": startCampaign(); toast("Campaign started"); break;
    case "camp-end": ui.confirm = "camp-end"; break;
    case "camp-end-yes": endCampaign(); ui.confirm = null; ui.rec = null; toast("Campaign ended"); break;
    case "pay": payPending(unitById(v)); break;
    case "undo": undoPending(unitById(v)); break;
    case "rec-open": ui.rec = { u: {} }; break;
    case "rec-close": ui.rec = null; break;
    case "rec-save": saveRecord(); break;
    case "inj-roll": applyInjury(unitById(v), roll(8)); break;
    case "inj-pick": applyInjury(unitById(v), +$(`#pick-${v}`).value); break;
    case "vdmg-roll": applyVDamage(unitById(v), roll(6)); break;
    case "vdmg-pick": applyVDamage(unitById(v), +$(`#pick-${v}`).value); break;
    case "heal": {
      const t = unitById(v), cost = isV(t) ? CAMPAIGN.vFixCP : CAMPAIGN.healCP;
      if ((t.cp || 0) < cost) { toast(`${t.name} needs ${cost} CP to ${isV(t) ? "fix" : "heal"} this`); return; }
      const list = isV(t) ? t.damage : t.injuries; const i = list.findIndex(x => x.id === b.dataset.i);
      const [gone1] = list.splice(i, 1); t.cp -= cost; logLine(`${t.name}: ${isV(t) ? "fixed" : "healed"} ${gone1.name} for ${cost} CP.`); break;
    }
    case "agenda-roll": { const t = unitById(v); const n = roll(6); t.agenda = { n, fails: 0 }; logLine(`${t.name} took a hidden agenda.`); toast(`${t.name}: ${AGENDAS[n - 1].name}`); break; }
    case "agenda-drop": unitById(v).agenda = null; break;
    case "convert": {
      const t = unitById(v), merc = t.traits.includes("Mercenary"), rate = merc ? 1 : CAMPAIGN.cpPerCredit;
      let n = parseInt($(`#conv-${v}`).value, 10) || 0; n = n - (n % rate);
      if (n <= 0) { toast(merc ? "Enter how many CP to convert" : "Enter an even number of CP (2 CP = 1 credit)"); return; }
      if (n > (t.cp || 0)) { toast(`${t.name} only has ${t.cp || 0} CP`); return; }
      t.cp -= n; cp.credits += n / rate; logLine(`${t.name} converted ${n} CP into ${n / rate} credits.`); break;
    }
    case "cr-adj": { const n = parseInt($("#cr-adj").value, 10); if (!n) { toast("Enter an amount, like 12 or -5"); return; } cp.credits = Math.max(0, cp.credits + n); logLine(`Credits adjusted by ${sgn(n)}.`); break; }
    case "pool-give": {
      const t = unitById($("#pool-to").value), n = parseInt($("#pool-amt").value, 10) || 0;
      if (!t || n <= 0) { toast("Pick who gets the points and how many"); return; }
      if (n > cp.pool) { toast(`The pool only has ${cp.pool} CP`); return; }
      cp.pool -= n; t.cp = (t.cp || 0) + n; logLine(`${n} CP from the pool to ${t.name}.`); break;
    }
    case "squad-lose": { const t = unitById(v); t.size -= 1; if (t.snap) t.snap = buildOf(t); logLine(`${t.name} lost a member for good (${t.size} left).${t.size < RULES.squadMin ? " Fewer than 3: they now act as independent characters." : ""}`); break; }
    case "replace": { const dead = unitById(v); const n = newCharacter(`Replacement for ${dead.name}`); Object.assign(n, { draft: true, waived: true, cp: 0, injuries: [], status: "active" }); w.characters.push(n); ui.sel = n.id; ui.tab = "build"; break; }
    case "remove-gone": { const t = unitById(v); const list = isV(t) ? w.vehicles : w.characters; list.splice(list.indexOf(t), 1); if (ui.sel === v) ui.sel = firstUnit()?.id ?? null; break; }
    // custom weapons
    case "cwrule": ui.cw.rules = toggleIn(ui.cw.rules, v); break;
    case "cwsave": {
      const f = ui.cw, k = cwCost(f);
      if (!f.name.trim()) { toast("Give the weapon a name first"); $("#cw-name")?.focus(); return; }
      if (!maxDamage(f.dmg)) { toast("Damage needs dice, like 2D6+2"); $("#cw-dmg")?.focus(); return; }
      w.customWeapons.push({ id: "cw-" + uid(), custom: true, name: f.name.trim(), type: [f.kind, ...f.keywords.split(",").map(s => s.trim()).filter(Boolean)].join(", "),
        hands: f.oneHanded ? 1 : 2, dmg: f.dmg.toUpperCase().replace(/\s+/g, ""), rules: [...f.rules], ammo: f.rules.includes("Reload") ? f.ammo : undefined, range: f.kind === "Melee" ? 0 : +f.range || 0, cost: k.total });
      toast(`${f.name.trim()} forged for ${k.total} credits`); ui.cw = blankCW(); break;
    }
    case "cwdel": w.customWeapons = w.customWeapons.filter(x => x.id !== v); w.characters.forEach(cc => cc.weapons = cc.weapons.filter(x => x.id !== v)); w.vehicles.forEach(x => Object.keys(x.mounts).forEach(k => { if (x.mounts[k] === v) delete x.mounts[k]; })); break;
    // saved
    case "wb-new": { const n = newWarband(); db.warbands[n.id] = n; db.current = n.id; ui.sel = null; ui.tab = "build"; ui.rec = null; break; }
    case "wb-open": db.current = v; ui.sel = firstUnit()?.id ?? null; ui.tab = "build"; ui.rec = null; break;
    case "wb-del": ui.confirm = "wb:" + v; break;
    case "wb-del-yes": {
      delete db.warbands[v]; ui.confirm = null;
      if (!Object.keys(db.warbands).length) { const n = newWarband(); db.warbands[n.id] = n; }
      if (!db.warbands[db.current]) { db.current = Object.keys(db.warbands)[0]; ui.sel = firstUnit()?.id ?? null; }
      break;
    }
    case "wb-copy": {
      const text = JSON.stringify(db.warbands[v]);
      const box = $("#export-box"); box.hidden = false; box.value = text;
      try { navigator.clipboard.writeText(text).then(() => toast("Warband copied"), () => { box.select(); toast("Select and copy the text below"); }); }
      catch (err) { box.select(); toast("Select and copy the text below"); }
      return;
    }
    case "wb-import": {
      try {
        const d = JSON.parse($("#import-box").value);
        if (!d || !Array.isArray(d.characters)) throw 0;
        d.id = uid(); d.updated = Date.now(); d.limit = +d.limit || RULES.defaultLimit;
        migrate(d);
        d.characters.forEach(cc => { cc.id = cc.id || uid(); cc.traits = cc.traits.filter(n => TRAIT[n]); cc.abilities = cc.abilities.filter(n => ABIL[n]); });
        db.warbands[d.id] = d; db.current = d.id; ui.sel = firstUnit()?.id ?? null; ui.tab = "build"; toast(`Loaded ${d.name}`);
      } catch (err) { toast("That text isn't a warband from this builder"); return; }
      break;
    }
    default: return;
  }
  save(); render();
});

document.addEventListener("input", e => {
  const el = e.target, w = wb(), u = sel();
  if (el.dataset.bind) {
    if (el.dataset.bind === "wb-name") w.name = el.value;
    if (el.dataset.bind === "wb-limit") w.limit = Math.max(0, parseInt(el.value, 10) || 0);
    if (el.dataset.bind === "c-name") { u.name = el.value; const r = document.querySelector(`.rcard[aria-current="true"] .nm`); if (r && r.firstChild) r.firstChild.textContent = el.value || "Unnamed"; }
    if (el.dataset.bind === "c-bg") u.background = el.value;
    save(); refreshLight(); return;
  }
  if (el.dataset.filter) {
    if (el.dataset.filter === "trait") ui.traitFilter = el.value; else ui.weapFilter = el.value;
    applyFilter(el.dataset.filter); return;
  }
  if (el.dataset.rec) {
    const [id, f] = el.dataset.rec.split(":");
    ui.rec.u[id] = ui.rec.u[id] || {};
    ui.rec.u[id][f] = el.type === "checkbox" ? el.checked : el.value;
    if (f === "killed" && el.checked) { const s = document.getElementById(`rec-${id}-surv`); if (s) { s.checked = false; ui.rec.u[id].surv = false; } const uw = document.getElementById(`rec-${id}-unw`); if (uw) { uw.checked = false; ui.rec.u[id].unw = false; } }
    return;
  }
  if (el.dataset.cw) {
    const key = el.dataset.cw;
    ui.cw[key] = el.type === "checkbox" ? el.checked : el.value;
    if (key === "kind" || key === "oneHanded") { render(); return; }
    $("#cw-calc").innerHTML = cwCalc(cwCost(ui.cw));
  }
});
document.addEventListener("change", e => {
  if (e.target.dataset.photo) { setPhoto(e.target.files[0]); e.target.value = ""; return; }
  if (e.target.dataset.mount) { const v = veh(); if (e.target.value) v.mounts[e.target.dataset.mount] = e.target.value; else delete v.mounts[e.target.dataset.mount]; save(); render(); return; }
  if (e.target.dataset.cw === "kind" || e.target.dataset.cw === "ammo") { ui.cw[e.target.dataset.cw] = e.target.value; render(); }
});
document.addEventListener("dragover", e => { const d = e.target.closest("[data-drop]"); if (d) { e.preventDefault(); d.firstElementChild.classList.add("drop"); } });
document.addEventListener("dragleave", e => { const d = e.target.closest("[data-drop]"); if (d) d.firstElementChild.classList.remove("drop"); });
document.addEventListener("drop", e => { const d = e.target.closest("[data-drop]"); if (d) { e.preventDefault(); setPhoto(e.dataTransfer.files[0]); } });

load(); render();
</script>
